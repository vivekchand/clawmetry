<div class="page" id="page-transcripts">
  <div class="refresh-bar" style="align-items:center;gap:10px;">
    <button class="refresh-btn" onclick="loadTranscripts()">↻ <span data-i18n="common.refresh">Refresh</span></button>
    <!-- Grafana-style date/time-range picker (static/js/time-range-picker.js).
         Filters the sessions list by active-in-window. Wired into the
         existing setTranscriptTimeRange / applyTranscriptAbsoluteRange
         helpers in app.js, so the "Viewing history" banner + filter logic
         keep working unchanged. Mounted by _transcriptsMountRangePicker(). -->
    <div id="transcripts-range-picker" title="Show sessions active in a specific time window"></div>
    <span id="transcripts-range-count" style="font-size:11px;color:var(--text-muted);"></span>
  </div>
  <div id="tx-custom-range" style="display:none;"></div>
  <div id="tx-history-banner" style="display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid rgba(245,158,11,0.5);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#f59e0b;">
    <span>🕐 <span data-i18n="transcripts.viewing_history">Viewing history</span> · <span id="tx-history-banner-text"></span></span>
    <button class="refresh-btn" onclick="setTranscriptTimeRange('live')" style="font-weight:600;" data-i18n="brain.back_to_live">● Back to live</button>
  </div>
  <div class="refresh-bar" style="margin-top:-6px;">
    <button class="refresh-btn" id="transcript-plumbing-btn" onclick="toggleTranscriptPlumbing()" data-i18n-title="transcripts.plumbing_tooltip" title="Show Self-Evolve sessions: the agent's own self-review runs (FIX mode + re-analyze), hidden by default because they're plumbing, not your sessions" style="font-weight:500;display:none"><span id="transcript-plumbing-state">○</span> <span data-i18n="transcripts.show_plumbing">Show plumbing</span> <span id="transcript-plumbing-count" style="opacity:0.7;font-size:11px;"></span></button>
    <button class="refresh-btn" id="transcript-back-btn" style="display:none" onclick="showTranscriptList()">← <span data-i18n="transcripts.back_to_list">Back to list</span></button>
  </div>
  <div class="card" id="transcript-list" data-i18n="app.loading">Loading...</div>
  <div id="transcript-viewer" style="display:none">
    <div class="transcript-viewer-meta" id="transcript-meta"></div>
    <!-- Authority footprint panel (#880) — populated async by _loadAuthorityPanel() -->
    <div id="authority-panel" style="display:none;margin-bottom:10px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;overflow:hidden;">
      <div id="authority-panel-toggle" onclick="document.getElementById('authority-panel-body').style.display=document.getElementById('authority-panel-body').style.display==='none'?'':'none'" style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;user-select:none;">
        <span style="font-size:12px;font-weight:700;color:var(--text-primary);">🔒 <span data-i18n="transcripts.authority_footprint">Authority Footprint</span></span>
        <span id="authority-panel-summary" style="font-size:11px;color:var(--text-muted);"></span>
      </div>
      <div id="authority-panel-body" style="padding:0 12px 10px 12px;display:none;"></div>
    </div>
    <!-- Session Replay Controls -->
    <div id="replay-controls" style="
      display:none;
      background:var(--bg-secondary);
      border:1px solid var(--border-secondary);
      border-radius:10px;
      padding:12px 14px;
      margin-bottom:10px;
      ">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
        <button id="replay-prev" onclick="replayPrev()" style="
          padding:5px 12px;
          border-radius:6px;
          border:none;
          background:var(--button-bg);
          color:var(--text-primary);
          cursor:pointer;
          font-size:14px;
          ">◀</button>
        <span id="replay-pos" style="
          font-size:13px;
          color:var(--text-muted);
          min-width:60px;
          text-align:center;
          ">0/0</span>
        <button id="replay-next" onclick="replayNext()" style="
          padding:5px 12px;
          border-radius:6px;
          border:none;
          background:var(--button-bg);
          color:var(--text-primary);
          cursor:pointer;
          font-size:14px;
          ">▶</button>
        <input type="range" id="replay-scrubber" min="0" max="0" value="0" oninput="replayJumpTo(parseInt(this.value))" style="
          flex:1;
          min-width:120px;
          accent-color:#6366f1;
          ">
        <button id="replay-sort-toggle" onclick="toggleTranscriptSort()" title="Oldest turn at top — click to flip to newest first" style="
          padding:5px 12px;
          border-radius:6px;
          border:1px solid var(--border-secondary);
          background:var(--button-bg);
          color:var(--text-secondary);
          cursor:pointer;
          font-size:12px;
          white-space:nowrap;
          ">↓ Oldest first</button>
        <button id="replay-expand-tools" onclick="expandAllToolDives()" title="Open every tool call/result in this trace" style="
          padding:5px 10px;
          border-radius:6px;
          border:1px solid var(--border-secondary);
          background:var(--button-bg);
          color:var(--text-secondary);
          cursor:pointer;
          font-size:12px;
          white-space:nowrap;
          ">⤢ Expand tools</button>
        <button id="replay-collapse-tools" onclick="collapseAllToolDives()" title="Collapse every tool call/result — turns the trace back into a skimmable chat" style="
          padding:5px 10px;
          border-radius:6px;
          border:1px solid var(--border-secondary);
          background:var(--button-bg);
          color:var(--text-secondary);
          cursor:pointer;
          font-size:12px;
          white-space:nowrap;
          ">⤡ Collapse tools</button>
        <button id="replay-raw-toggle" onclick="toggleTranscriptRaw()" data-i18n-title="transcripts.raw_tooltip" title="Toggle between the beautified turn and the exact JSON payload OpenClaw recorded" style="
          padding:5px 12px;
          border-radius:6px;
          border:1px solid var(--border-secondary);
          background:var(--button-bg);
          color:var(--text-secondary);
          cursor:pointer;
          font-size:12px;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
          white-space:nowrap;
          ">{ } <span data-i18n="transcripts.raw">Raw</span></button>
        <button id="replay-play-btn" onclick="replayTogglePlay()" title="Auto-advance through turns at 10× speed" style="
          padding:5px 12px;
          border-radius:6px;
          border:1px solid var(--border-secondary);
          background:var(--button-bg);
          color:var(--text-secondary);
          cursor:pointer;
          font-size:12px;
          white-space:nowrap;
          ">▶ <span data-i18n="transcripts.play">Play</span></button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="replay-filter active-filter" data-type="all" onclick="replayFilter('all')" style="
          padding:4px 10px;
          border-radius:20px;
          border:1px solid var(--border-secondary);
          background:#6366f1;
          color:#fff;
          font-size:12px;
          cursor:pointer;
          " data-i18n="transcripts.filter_all">All</button>
        <button class="replay-filter" data-type="tool_use" onclick="replayFilter('tool_use')" style="
          padding:4px 10px;
          border-radius:20px;
          border:1px solid var(--border-secondary);
          background:var(--button-bg);
          color:var(--text-secondary);
          font-size:12px;
          cursor:pointer;
          ">🔧 <span data-i18n="transcripts.filter_tools">Tools</span></button>
        <button class="replay-filter" data-type="thinking" onclick="replayFilter('thinking')" style="
          padding:4px 10px;
          border-radius:20px;
          border:1px solid var(--border-secondary);
          background:var(--button-bg);
          color:var(--text-secondary);
          font-size:12px;
          cursor:pointer;
          ">🧠 <span data-i18n="transcripts.filter_thinking">Thinking</span></button>
        <button class="replay-filter" data-type="assistant" onclick="replayFilter('assistant')" style="
          padding:4px 10px;
          border-radius:20px;
          border:1px solid var(--border-secondary);
          background:var(--button-bg);
          color:var(--text-secondary);
          font-size:12px;
          cursor:pointer;
          ">🫰 <span data-i18n="transcripts.filter_ai">AI</span></button>
        <button class="replay-filter" data-type="user" onclick="replayFilter('user')" style="
          padding:4px 10px;
          border-radius:20px;
          border:1px solid var(--border-secondary);
          background:var(--button-bg);
          color:var(--text-secondary);
          font-size:12px;
          cursor:pointer;
          ">👤 <span data-i18n="transcripts.filter_user">User</span></button>
      </div>
    </div>
    <!-- Replay "as of T" state panel: model / thinking level / tokens accumulated.
         Shown by _updateReplayStatePanel() when replay controls are active. -->
    <div id="replay-state" style="display:none;background:var(--bg-secondary);border:1px solid var(--border-secondary);border-radius:8px;padding:7px 14px;margin-bottom:8px;font-size:12px;color:var(--text-secondary);gap:14px;flex-wrap:wrap;align-items:center;">
      <span>🤖 <span data-i18n="transcripts.replay_model">Model</span>: <strong id="replay-state-model" style="color:var(--text-primary);">—</strong></span>
      <span>💡 <span data-i18n="transcripts.replay_thinking">Thinking</span>: <strong id="replay-state-thinking" style="color:var(--text-primary);">—</strong></span>
      <span>📈 <span data-i18n="transcripts.replay_tokens">Tokens so far</span>: <strong id="replay-state-tokens" style="color:var(--text-primary);">0</strong></span>
    </div>
    <!-- Turn-anchored layout (session-trace redesign): messages on the left,
         sticky jump-to-turn TOC on the right. TOC is populated by
         _renderTurnTOC() each time _replayRenderCurrent() runs; it hides on
         narrow viewports so mobile falls back to plain vertical scroll. -->
    <div class="transcript-layout">
      <div class="chat-messages" id="transcript-messages"></div>
      <aside class="transcript-toc" id="transcript-toc"
             title="Every user prompt in this session — click to jump"></aside>
    </div>
  </div>
</div>

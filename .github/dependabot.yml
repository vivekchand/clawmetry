version: 2

# Every ecosystem below carries `cooldown: default-days: 7`.
#
# A version update that lands the hour a release is published is the window
# a compromised package is published INTO. Registry takeovers are
# opportunistic and short-lived: the malicious version is typically yanked
# within a day or two, so the whole attack depends on somebody pulling it
# before that happens. Waiting a week means an automated bump adopts a
# release the rest of the ecosystem has already had time to look at. It
# also keeps ordinary regressions out of the tree.
#
# This does NOT delay security fixes. Cooldown applies to version updates
# only; a Dependabot SECURITY update opens immediately regardless of what
# is configured here, so an advisory fix still arrives the day it exists.
# That distinction is the reason the value can be this conservative --
# nothing on the advisory path is slowed by it.
#
# Seven days rather than the built-in three: three is GitHub's default, and
# it is inside the window where a compromised release is often still up.
updates:
  # Python (pip) dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # pip — the hash-pinned install sets the supply-chain.yml scanner jobs run on
  # (.github/requirements/*.txt: pip-audit, cyclonedx-bom, zizmor, bandit,
  # atheris, and the pytest/requests/certifi those jobs need). The other half of
  # that pin: --require-hashes makes the install reproducible and
  # integrity-checked, and this entry is what keeps it moving. Without it the
  # security scanners would sit on one release indefinitely, which is the frozen
  # end of the same problem the unpinned install was at the other end of.
  #
  # Dependabot rewrites the --hash lines along with the version, so a bump here
  # arrives already verifiable. Grouped, because these are CI tooling and a
  # routine week should be one PR rather than five.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      ci-scanners:
        patterns:
          - "*"
    # These releases cannot install on the Python the CI jobs run (3.11), and
    # a hash-pinned install fails the whole job rather than the one package.
    # The 2026-09-12 group bump broke E2E Browser Tests (the required E2E Gate
    # leg, so every OSS PR), Fuzz and Python dependency audit on main at once.
    # Lift each rule when its job moves to a Python that can install it.
    ignore:
      - dependency-name: "pyee"          # 14.x requires Python >= 3.12
        versions: [">=14"]
      - dependency-name: "atheris"       # 3.1.0 has no wheel for the fuzz job
        versions: [">=3.1"]
      - dependency-name: "chardet"       # 7.x conflicts with a python-deps.txt pin
        versions: [">=6"]
    cooldown:
      default-days: 7

  # Docker base images. Required because the Dockerfile pins its base image by
  # sha256 digest: a digest never moves on its own, so without an updater the
  # image would stay on whatever CVEs it shipped with on the day it was pinned.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # The published self-hosted server image (deploy/self-hosted/Dockerfile.release)
  # pins the same base by digest, and a second pin with no updater would freeze
  # the signed image at today's CVEs while the source build moved on.
  - package-ecosystem: "docker"
    directory: "/deploy/self-hosted"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # pip -- deploy/self-hosted/otel-requirements.txt, the hash-pinned OTLP
  # decoder baked into that same signed image. The other half of that pin:
  # --require-hashes makes the install reproducible and integrity-checked, and
  # this entry is what keeps it moving. Without it the signed image would sit
  # on one protobuf indefinitely, which is the frozen end of the same problem
  # the unpinned `[otel]` range was at the other end of.
  #
  # Dependabot rewrites the --hash lines along with the version, so a bump
  # arrives already verifiable. Kept SEPARATE from the /.github/requirements
  # entry that advances the root image's docker-otel.txt: the two files pin the
  # same two names today but describe different artifacts (development build vs
  # published, signed image), and tests/test_selfhosted_image_publish.py only
  # holds them to the same package NAMES, never the same versions -- so either
  # may bump on its own week without the other going red.
  - package-ecosystem: "pip"
    directory: "/deploy/self-hosted"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # npm — the React SPA. This is the repo's largest JS dependency tree and
  # the only one with a committed lockfile that ships into clawmetry/static/.
  # Minor/patch updates are grouped so a routine week is one PR, not twenty.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # npm — Playwright E2E harness. Runs in CI on every PR, so its
  # dependencies are part of the CI supply chain.
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      e2e-minor-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # npm — the Claude Code CLI that CI workflows shell out to
  # (harness-observability-audit, i18n-autotranslate, i18n-docs-autotranslate).
  # Those jobs install it with `npm ci` from a committed lockfile, so without an
  # updater here the pin would simply freeze. This is the same pin/updater
  # pairing described above for the SHA pins: the lock makes an upgrade
  # deliberate, this entry keeps it from going stale.
  - package-ecosystem: "npm"
    directory: "/.github/claude-cli"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # npm — the Playwright the Auth Bootstrap Guard workflow's smoke test runs
  # on. It is the other half of that pin: the lockfile makes the install
  # reproducible and integrity-checked, and this entry is what keeps it
  # moving. Kept in step with /tests/e2e, which pins the same Playwright
  # line; bumping one without the other means CI downloads two browser
  # builds for no reason.
  - package-ecosystem: "npm"
    directory: "/.github/ci-node/auth-bootstrap"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # npm — the OpenClaw CLI the setup-openclaw composite action installs. It is
  # the other half of that pin: the lockfile makes the install reproducible and
  # integrity-checked, and this entry is what keeps it moving. Without it, every
  # E2E and screenshot job would sit on one OpenClaw release indefinitely, which
  # is a worse place to be than the moving dist-tag it replaced.
  #
  # READ BEFORE MERGING A BUMP HERE. This is not a routine dependency. The
  # directory's package.json carries the long form under its `//overrides`
  # key; the short version, re-measured 2026-10-02 against openclaw 2026.9.7:
  #
  #   1. The SQLite transcript boundary is CLEARED. It used to be the second
  #      of the two blockers recorded here: OpenClaw moved per-session
  #      `<sid>.jsonl` transcripts into
  #      `agents/<id>/agent/openclaw-agent.sqlite`, and the daemon only
  #      globbed `agents/main/sessions/*.jsonl`, so a bump past that boundary
  #      took the live E2E suites red. #6233 shipped
  #      `clawmetry/openclaw_sqlite.py`, which reads that store read-only and
  #      mirrors it into the JSONL layout the daemon already ingests; its
  #      CHANGELOG entry records a verified daemon ingest of a live OpenClaw
  #      2026.9.7 store. Released in 0.12.901. Not a reason to hold the pin
  #      any more, and the 2026.5.28..2026.6.34 boundary hunt is moot.
  #
  #   2. The advisory trade now FAVOURS the bump, which it did not in
  #      September. Measured by regenerating the lockfile with only the
  #      version changed to 2026.9.7, keeping the overrides below as they
  #      are: 3 advisories before (all high -- openclaw <=2026.6.5-beta.6,
  #      extract-zip, @earendil-works/pi-coding-agent <=0.78.1) and 3 after
  #      (2 high + 1 moderate, no critical). All three current highs clear.
  #      The 2026-09-22 figures below -- 4 packages / 26 advisories to 16 /
  #      67 at 2026.5.27, gaining a critical -- do NOT reproduce at 2026.9.7:
  #      the overrides have been extended since, and the top-level copies
  #      stay patched (brace-expansion 5.0.12, ip-address 10.7.2, openclaw's
  #      own undici 8.10.2).
  #
  #      Why no override clears the 3 that remain: openclaw 2026.9.7 takes
  #      `npm` 11.20.0 as a direct dependency, and all three resolve under
  #      node_modules/npm/node_modules/ with `inBundle: true`
  #      (brace-expansion GHSA-q2hr-2g5m-vwhr, undici GHSA-r53p-7pc4-xj5r,
  #      ip-address GHSA-j6r3-76f7-8jcv). `overrides` cannot rewrite a
  #      package manager's bundled dependencies, so these are not clearable
  #      from this file at any openclaw version.
  #
  #   3. THE REMAINING BLOCKER IS NODE, and it is new. openclaw 2026.9.7
  #      declares `engines.node: ">=24.16.0 <25 || >=26.1.0"`. This action's
  #      `node-version` default is the bare major "22", and no workflow in
  #      this repository sets up Node 24 (nine are on "20", three on "22").
  #      So the bump is a Node major move for every setup-openclaw caller --
  #      ci.yml, e2e-nightly.yml, moat-keystone-drive-nightly.yml,
  #      openclaw-boot.yml and oss-golden-path.yml, plus clawmetry-cloud's
  #      own copy of the action in cloud-e2e-screenshots.yml -- and not a
  #      version change. That is the decision the pin now waits on, and it is
  #      a larger one than a dependency bump: raise the default and the whole
  #      E2E fleet moves with it.
  #
  # Expect the bump PR to fail until that Node default moves; that failure is
  # the signal, not a flake.
  - package-ecosystem: "npm"
    directory: "/.github/actions/setup-openclaw"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # npm — the ClawHub/OpenClaw plugin, which is published to npm
  # (openclaw.release.publishToNpm). No lockfile, so Dependabot updates the
  # manifest ranges.
  - package-ecosystem: "npm"
    directory: "/clawhub-plugin"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # npm — the PR visual-diff bot's Playwright/pixelmatch/pngjs
  # (.github/scripts/, driven by pr-screenshots.yml). The other half of that
  # pin: the lockfile makes the install reproducible and integrity-checked,
  # and this entry is what keeps it moving. Without it the bot would sit on
  # one Playwright forever, which is the frozen end of the same problem the
  # unpinned install was at the other end of.
  - package-ecosystem: "npm"
    directory: "/.github/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

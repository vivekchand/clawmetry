version: 2

# Every ecosystem below carries `cooldown: default-days: 7`.
#
# A version update that lands the hour a release is published is the window
# a compromised package is published INTO. Registry takeovers are
# opportunistic and short-lived: the malicious version is typically yanked
# within a day or two, so the whole attack depends on somebody pulling it
# before that happens. Waiting a week means an automated bump adopts a
# release the rest of the ecosystem has already had time to look at. It
# also keeps ordinary regressions out of the tree.
#
# This does NOT delay security fixes. Cooldown applies to version updates
# only; a Dependabot SECURITY update opens immediately regardless of what
# is configured here, so an advisory fix still arrives the day it exists.
# That distinction is the reason the value can be this conservative --
# nothing on the advisory path is slowed by it.
#
# Seven days rather than the built-in three: three is GitHub's default, and
# it is inside the window where a compromised release is often still up.
updates:
  # Python (pip) dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # pip — the hash-pinned install sets the supply-chain.yml scanner jobs run on
  # (.github/requirements/*.txt: pip-audit, cyclonedx-bom, zizmor, bandit,
  # atheris, and the pytest/requests/certifi those jobs need). The other half of
  # that pin: --require-hashes makes the install reproducible and
  # integrity-checked, and this entry is what keeps it moving. Without it the
  # security scanners would sit on one release indefinitely, which is the frozen
  # end of the same problem the unpinned install was at the other end of.
  #
  # Dependabot rewrites the --hash lines along with the version, so a bump here
  # arrives already verifiable. Grouped, because these are CI tooling and a
  # routine week should be one PR rather than five.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      ci-scanners:
        patterns:
          - "*"
    # `directory` is not a leaf: Dependabot scans the subdirectories under it
    # too, so this entry also claimed `py39/`, the sets resolved for CPython
    # 3.9 that have their OWN entry (and its 3.10+ ceilings) below. Both
    # streams owning the same file means the one WITHOUT the ceilings can bump
    # it: #6707 is based on the commit that created the split and still
    # rewrote `py39/ci-lint-verify.txt` to click==8.5.1, which declares
    # Requires-Python >= 3.10, taking "Syntax & Lint" -- a gate on every PR --
    # red. Excluding the subdirectory here is what makes the split below
    # actually hold.
    #
    # This matters beyond one red PR: while a group PR sits un-mergeable,
    # Dependabot answers `pull_request_exists_for_security_update` for this
    # directory and opens no SECURITY updates for any of its sets, the one
    # that installs bandit/pip-audit/zizmor included.
    #
    # Patterns are relative to `directory` (GitHub's dependabot options
    # reference, "exclude-paths"). The repository-root spelling is listed
    # beside it because this option's failure mode is silent -- a pattern that
    # anchors elsewhere excludes nothing and the overlap returns unnoticed --
    # and a pattern that matches nothing costs nothing.
    exclude-paths:
      - "py39/**"
      - ".github/requirements/py39/**"
      # pip-bootstrap-py39.txt is the same hole with no directory to put it
      # in. It is a 3.9-ONLY set -- the bootstrap pip for the 3.9 matrix
      # cells of release-canary.yml and conformance-heartbeat.yml -- but it
      # sits beside the 3.11 sets rather than under py39/, so this entry
      # owned it without this entry's ceilings. pip 26.1 moved
      # Requires-Python to >= 3.10, so every bump proposed here since has
      # been one the 3.9 cells cannot install: #6047 proposed 26.2, and
      # #6713 proposed 26.3 and is red on it now.
      #
      # It is excluded rather than ceilinged because `ignore` is scoped to
      # an entry, not a file (see the py39 entry below): a `pip >= 26.1`
      # rule here would equally freeze pip-bootstrap.txt,
      # pip-build-bootstrap.txt, pip-wheel-bootstrap.txt and python-deps.txt,
      # four sets resolved for 3.11 that can take the bump. Excluding one
      # file costs less than freezing pip in four.
      #
      # The pin this leaves standing is the one the file's own header already
      # declares frozen ("does not move again until the repo drops 3.9"), so
      # nothing is withheld that was going to be taken. The cost is that a
      # 26.0.x pip security release -- which the guard test DOES allow --
      # would now need a bump by hand; the file carries one name and pip has
      # no dependencies of its own, so that is a one-line change.
      - "pip-bootstrap-py39.txt"
      - ".github/requirements/pip-bootstrap-py39.txt"
    # These releases cannot install on the Python the CI jobs run (3.11), and
    # a hash-pinned install fails the whole job rather than the one package.
    # The 2026-09-12 group bump broke E2E Browser Tests (the required E2E Gate
    # leg, so every OSS PR), Fuzz and Python dependency audit on main at once.
    # Lift each rule when its job moves to a Python that can install it.
    ignore:
      - dependency-name: "pyee"          # 14.x requires Python >= 3.12
        versions: [">=14"]
      - dependency-name: "atheris"       # 3.1.0 has no wheel for the fuzz job
        versions: [">=3.1"]
      - dependency-name: "chardet"       # 7.x conflicts with a python-deps.txt pin
        versions: [">=6"]
    cooldown:
      default-days: 7

  # pip -- .github/requirements/py39/, the sets resolved for CPython 3.9.
  #
  # Why these are a SEPARATE entry and not more `ignore` rules on the one
  # above. ci.yml's "Syntax & Lint" job runs on 3.9 deliberately (it is the
  # floor setup.py advertises), so its install set sits at the last release of
  # each name that still installs there. The directory above is resolved for
  # 3.11 and pins the newer releases of those same names. `ignore` is scoped
  # to an entry, not to a file, so a `click >= 8.2` rule written up there to
  # protect the 3.9 set would equally stop click moving in the twelve
  # 3.11-resolved sets beside it -- trading a weekly red PR for silently
  # frozen pins in the sets that CAN take the bump. Splitting the directory is
  # what lets each stream carry the ceiling that is true for it.
  #
  # Without this entry the group bump above proposes a release that cannot
  # install on 3.9, `--require-hashes` fails the whole step rather than the one
  # package, and "Syntax & Lint" -- which gates every PR -- goes red on the
  # bump PR. That red also blocks the directory's SECURITY updates: Dependabot
  # answers `pull_request_exists_for_security_update` and opens none while the
  # stuck group PR is open, so advisories affecting the 3.11 sets wait behind a
  # PR that can never go green.
  #
  # Each ceiling below is the FIRST release above the current pin that declares
  # Requires-Python >= 3.10, measured against PyPI on 2026-11-24. No name here
  # has an installable release above its pin, so none of these rules withholds
  # a bump the job could take. Lift each rule when this job's interpreter
  # moves; at that point the whole set folds into ci-tests.txt, which already
  # pins the fixed releases. The four of these that are also named by
  # published advisories are declared, with their exposure analysed, in
  # `.github/requirements/audit-acceptance.json` and the pin file's own header.
  - package-ecosystem: "pip"
    directory: "/.github/requirements/py39"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "click"              # 8.2.0+ requires >= 3.10
        versions: [">=8.2.0"]
      - dependency-name: "importlib-metadata" # 8.8.0+ requires >= 3.10
        versions: [">=8.8.0"]
      - dependency-name: "iniconfig"          # 2.2.0+ requires >= 3.10
        versions: [">=2.2.0"]
      - dependency-name: "packaging"          # 26.4+ requires >= 3.10
        versions: [">=26.4"]
      - dependency-name: "pluggy"             # 1.7.0+ requires >= 3.10
        versions: [">=1.7.0"]
      - dependency-name: "pytest"             # 9.0.0+ requires >= 3.10
        versions: [">=9.0.0"]
      - dependency-name: "pyyaml"             # 6.0.4+ requires >= 3.10
        versions: [">=6.0.4"]
      - dependency-name: "requests"           # 2.33.0+ requires >= 3.10
        versions: [">=2.33.0"]
      - dependency-name: "urllib3"            # 2.7.0+ requires >= 3.10
        versions: [">=2.7.0"]
      - dependency-name: "zipp"               # 4.1.0+ requires >= 3.10
        versions: [">=4.1.0"]
    cooldown:
      default-days: 7

  # Docker base images. Required because the Dockerfile pins its base image by
  # sha256 digest: a digest never moves on its own, so without an updater the
  # image would stay on whatever CVEs it shipped with on the day it was pinned.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # The published self-hosted server image (deploy/self-hosted/Dockerfile.release)
  # pins the same base by digest, and a second pin with no updater would freeze
  # the signed image at today's CVEs while the source build moved on.
  - package-ecosystem: "docker"
    directory: "/deploy/self-hosted"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # pip -- deploy/self-hosted/otel-requirements.txt, the hash-pinned OTLP
  # decoder baked into that same signed image. The other half of that pin:
  # --require-hashes makes the install reproducible and integrity-checked, and
  # this entry is what keeps it moving. Without it the signed image would sit
  # on one protobuf indefinitely, which is the frozen end of the same problem
  # the unpinned `[otel]` range was at the other end of.
  #
  # Dependabot rewrites the --hash lines along with the version, so a bump
  # arrives already verifiable. Kept SEPARATE from the /.github/requirements
  # entry that advances the root image's docker-otel.txt: the two files pin the
  # same two names today but describe different artifacts (development build vs
  # published, signed image), and tests/test_selfhosted_image_publish.py only
  # holds them to the same package NAMES, never the same versions -- so either
  # may bump on its own week without the other going red.
  - package-ecosystem: "pip"
    directory: "/deploy/self-hosted"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # npm — the React SPA. This is the repo's largest JS dependency tree and
  # the only one with a committed lockfile that ships into clawmetry/static/.
  # Minor/patch updates are grouped so a routine week is one PR, not twenty.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # npm — Playwright E2E harness. Runs in CI on every PR, so its
  # dependencies are part of the CI supply chain.
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      e2e-minor-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # npm — the Claude Code CLI that CI workflows shell out to
  # (harness-observability-audit, i18n-autotranslate, i18n-docs-autotranslate).
  # Those jobs install it with `npm ci` from a committed lockfile, so without an
  # updater here the pin would simply freeze. This is the same pin/updater
  # pairing described above for the SHA pins: the lock makes an upgrade
  # deliberate, this entry keeps it from going stale.
  #
  # The pin set lives at /ci-node/claude-cli rather than under .github/
  # because an npm entry pointing inside .github/ cannot open a pull request
  # on this account: the updater resolves the new version, then the PR-creation
  # call is refused with HTTP 400 "The request contains invalid or unauthorized
  # changes" and the job records `dependency_file_not_supported`. See the
  # ci-node/README.md note for the measurements behind that.
  - package-ecosystem: "npm"
    directory: "/ci-node/claude-cli"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # npm — the Playwright the Auth Bootstrap Guard workflow's smoke test runs
  # on. It is the other half of that pin: the lockfile makes the install
  # reproducible and integrity-checked, and this entry is what keeps it
  # moving. Kept in step with /tests/e2e, which pins the same Playwright
  # line; bumping one without the other means CI downloads two browser
  # builds for no reason.
  #
  # Lives at /ci-node/auth-bootstrap, not under .github/, for the reason
  # recorded in ci-node/README.md.
  - package-ecosystem: "npm"
    directory: "/ci-node/auth-bootstrap"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # npm — the OpenClaw CLI the setup-openclaw composite action installs. It is
  # the other half of that pin: the lockfile makes the install reproducible and
  # integrity-checked, and this entry is what keeps it moving. Without it, every
  # E2E and screenshot job would sit on one OpenClaw release indefinitely, which
  # is a worse place to be than the moving dist-tag it replaced.
  #
  # READ BEFORE MERGING A BUMP HERE. This is not a routine dependency. The
  # directory's package.json carries the long form under its `//overrides`
  # key, including the override audit and the boot-gate result. The short
  # version, as of 2026-10-02:
  #
  #   1. The pin is 2026.9.2 and the tree is ADVISORY-CLEAN -- `npm audit`
  #      reports 0 vulnerabilities. Nothing is being held back. The 25
  #      advisories this entry used to describe (19 openclaw, 4
  #      @earendil-works/pi-coding-agent, 2 extract-zip) are gone: 2026.9.2
  #      fixes its own and no longer depends on the other two, which leave the
  #      tree along with pdfjs-dist and basic-ftp. Those 25 were the whole of
  #      this repository's OSSF Scorecard VulnerabilitiesID.
  #
  #   2. THERE IS NO NODE BLOCKER, and the claim that there was one is the
  #      correction this note exists to record. It said openclaw's
  #      `engines.node` had moved to ">=24.16.0 <25 || >=26.1.0", so moving the
  #      pin meant a Node MAJOR move for every setup-openclaw caller and for
  #      clawmetry-cloud's copy too. That floor is specific to 2026.9.7, the
  #      newest release, and was measured against it alone. 2026.6.35 declares
  #      ">=22.19.0"; everything from 2026.7.1 to 2026.9.6 declares
  #      ">=22.22.3 <23 || >=24.15.0 <25 || >=25.9.0". The action's
  #      `node-version` default is the bare major "22", which setup-node
  #      resolves to the newest 22.x (22.23.3 today), so 2026.9.2 installs with
  #      no workflow change at all.
  #
  #      The caller count was wrong in the same direction: "nine are on 20,
  #      three on 22" counted workflows that do not call this action. All six
  #      that do take the default.
  #
  #   3. The SQLite transcript boundary is CLEARED, and that still holds.
  #      OpenClaw moved per-session `<sid>.jsonl` transcripts into
  #      `agents/<id>/agent/openclaw-agent.sqlite`, and the daemon only globbed
  #      `agents/main/sessions/*.jsonl`, so a bump past that boundary used to
  #      take the live E2E suites red. #6233 shipped
  #      `clawmetry/openclaw_sqlite.py`, which reads that store read-only and
  #      mirrors it into the JSONL layout the daemon already ingests; its
  #      CHANGELOG entry records a verified daemon ingest of a live OpenClaw
  #      2026.9.7 store. Released in 0.12.901.
  #
  #   4. The overrides block STAYS. Six of its nine keys still resolve to a
  #      patched copy at the hoisted root, and deleting the block at 2026.9.2
  #      brings undici back high. Three keys (markdown-it, basic-ftp,
  #      pdfjs-dist) are inert because their packages left the tree; they are
  #      kept as no-ops that become correct again if a future openclaw pulls
  #      those packages back in.
  #
  # A bump here is still not a bare version change: run the gateway boot gate
  # (.github/workflows/openclaw-boot.yml) for any change to that lockfile or
  # its overrides. `npm ci` and `openclaw --version` both pass over a broken
  # module graph -- booting the gateway is what catches it.
  #
  # The one move that WOULD need a Node major is 2026.9.7. Nothing forces it:
  # the tree is already clean at 2026.9.2.
  - package-ecosystem: "npm"
    directory: "/.github/actions/setup-openclaw"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # npm — the ClawHub/OpenClaw plugin, which is published to npm
  # (openclaw.release.publishToNpm). No lockfile, so Dependabot updates the
  # manifest ranges.
  - package-ecosystem: "npm"
    directory: "/clawhub-plugin"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # npm — the PR visual-diff bot's Playwright/pixelmatch/pngjs
  # (ci-node/visual-diff/, driven by pr-screenshots.yml). The other half of
  # that pin: the lockfile makes the install reproducible and
  # integrity-checked, and this entry is what keeps it moving. Without it the
  # bot would sit on one Playwright forever, which is the frozen end of the
  # same problem the unpinned install was at the other end of.
  #
  # The set lives in ci-node/ rather than under .github/ because an npm entry
  # whose `directory:` is under .github/ cannot open a pull request on this
  # account: the updater resolves the version and writes the files, then the
  # PR call is refused with `400 — The request contains invalid or
  # unauthorized changes` and the job ends `dependency_file_not_supported`.
  # While it sat at /.github/scripts this entry delivered nothing, so the
  # playwright and pixelmatch bumps below had to be raised by hand or not at
  # all. ci-node/README.md carries the measurement.
  - package-ecosystem: "npm"
    directory: "/ci-node/visual-diff"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

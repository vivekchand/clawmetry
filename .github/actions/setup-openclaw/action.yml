name: "Setup OpenClaw"
description: "Install the pinned OpenClaw (Node CLI) and expose it on PATH for downstream E2E steps."

# Why npm and not pip:
#   OpenClaw is published to npm as `openclaw`.
#   The PyPI package named `openclaw` is an unrelated CMDOP plugin.
#   See: https://github.com/openclaw/openclaw
#
# Why a composite action:
#   Multiple workflows (pr-screenshots, e2e-nightly, openclaw-boot, future
#   real-data tests) need a working `openclaw` on PATH. Centralising the
#   install lets us move the pin once, in one place.

# The installed openclaw version is not an input. It is pinned in this
# directory's package.json and package-lock.json, so `npm ci` installs exactly
# the recorded tree and checks every tarball against its integrity hash. An
# upgrade is a Dependabot pull request against that lockfile, not a dist-tag
# resolved fresh on each run.
#
# Why the pin is 2026.5.12 and not the newest release:
#   `latest` was never actually resolved on a run. The actions/cache step this
#   action used to carry was keyed on the literal string "latest", so the key
#   never changed and never invalidated; every job since May restored that
#   cache and logged "openclaw cache hit, skipping install". CI has therefore
#   been testing against 2026.5.12 for months while appearing to track latest.
#   2026.5.12 is what the E2E suites are green against today, so pinning it
#   here is a no-op for behaviour and confines this change to the supply-chain
#   fix. Moving off it is real work, not a version bump — see the note on the
#   Dependabot entry in .github/dependabot.yml.
#
# The mirror of this action in vivekchand/clawmetry-cloud (cloud #2300) pins
# 2026.9.2, deliberately not the same version. Cloud has no live-OpenClaw
# transcript E2E, so the JSONL/SQLite boundary described above does not reach
# it. The two copies share a mechanism, not a version; keep them in step on the
# mechanism and let each pin what its own suites are green against.

inputs:
  gateway-token:
    description: "Value to export as OPENCLAW_GATEWAY_TOKEN for downstream steps."
    required: false
    default: "ci-openclaw-token"
  node-version:
    description: >-
      Node major to install. The pinned openclaw 2026.5.12 declares
      `>=22.16.0`, so the default names the major and lets setup-node resolve
      the newest 22.x. Newer openclaw releases enforce a much narrower range in
      their own install script rather than only warning, so a Dependabot bump
      is what would make this need changing.
    required: false
    default: "22"

outputs:
  version:
    description: "Resolved openclaw version (output of `openclaw --version`)."
    value: ${{ steps.verify.outputs.version }}
  gateway-token:
    description: "Token exported to OPENCLAW_GATEWAY_TOKEN."
    value: ${{ inputs.gateway-token }}

runs:
  using: "composite"
  steps:
    # The hand-rolled actions/cache step this action used to carry is gone with
    # the dist-tag it keyed on. setup-node's own `cache: npm` is deliberately
    # NOT enabled in its place: its `cache-dependency-path` is resolved against
    # the workspace root, and pr-screenshots.yml checks this repository out
    # under `head/`, where that path matches no file and the step fails. The
    # install is a few seconds either way; correctness on every caller is worth
    # more than the cache.
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    # `npm ci` installs the tree recorded in package-lock.json and nothing else:
    # no re-resolution against the registry's moving tags, and every tarball is
    # checked against its sha512 integrity hash. `--prefix` is what lets the
    # step run from the caller's working directory while installing into this
    # action's own directory.
    - name: Install OpenClaw (npm ci from the pinned lockfile)
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: |
        set -e
        npm ci --no-audit --no-fund --prefix "$ACTION_DIR"
        echo "$ACTION_DIR/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Verify openclaw on PATH
      id: verify
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: |
        set -e
        export PATH="$ACTION_DIR/node_modules/.bin:$PATH"
        which openclaw
        ver=$(openclaw --version 2>&1 | head -1)
        echo "openclaw version: $ver"
        echo "version=$ver" >> "$GITHUB_OUTPUT"

    - name: Export OPENCLAW_GATEWAY_TOKEN for downstream steps
      shell: bash
      env:
        OPENCLAW_GATEWAY_TOKEN_INPUT: ${{ inputs.gateway-token }}
      run: |
        set -e
        # Downstream workflow steps read this to authenticate dashboard
        # requests against the running gateway. Empty token = dashboard
        # falls back to anon mode (which is why "the screenshots are
        # always broken" today: no token, no authed screens).
        #
        # The value comes from the caller, so it is passed through the
        # environment instead of being expanded into this script. $GITHUB_ENV
        # is line-oriented: a newline in the value would define extra
        # variables for every later step in the job, so reject one loudly
        # rather than write it. The input is documented as a single token.
        case "$OPENCLAW_GATEWAY_TOKEN_INPUT" in
          *$'\n'*|*$'\r'*)
            echo "::error::setup-openclaw: gateway-token must be a single line"
            exit 1
            ;;
        esac
        printf 'OPENCLAW_GATEWAY_TOKEN=%s\n' \
          "$OPENCLAW_GATEWAY_TOKEN_INPUT" >> "$GITHUB_ENV"

name: Product record (requirements before code)

# Require a portable product-record citation before a product change merges.
# Independent review checks the actual criteria against the exact candidate.
# Historical Factory citations remain accepted during migration.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: prg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product-record:
    name: PR cites the product record that justified it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Keep ancestry for base...head without downloading screenshot history.
          filter: blob:none
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # The script's own tests run here too. A gate whose tests only run in
      # the main suite can rot silently while the gate keeps reporting green.
      - name: Self-test the gate
        # `requests` too: tests/conftest.py imports it at MODULE scope, so
        # without it pytest exits 4 on a collection error before running a
        # single test -- the job would fail for a reason unrelated to what it
        # checks. Caught by tests/test_workflow_yaml_valid.py on this very PR,
        # which is the guard doing its job.
        run: |
          python -m pip install --quiet --require-hashes \
            -r .github/requirements/gate-harness.txt
          python -m pytest tests/test_product_record_gate.py -q

      - name: Check this PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_product_record.py

name: Auto-deploy Cloud on OSS update

on:
  push:
    branches: [main]
    paths:
      - 'dashboard.py'
      - 'clawmetry/**'
      - 'setup.py'
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  pin-version:
    name: Rebuild cloud with latest OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OSS repo
        uses: actions/checkout@v7

      - name: Get OSS version
        id: oss_version
        # Source of truth is the LATEST PUBLISHED PyPI version, not the
        # checkout's __version__: release-on-merge publishes the bump to
        # PyPI without committing it back to dashboard.py, so the file is
        # permanently one-or-more releases stale. Reading it here was the
        # root cause of the 2026-07-31 stale-pin rollbacks (with the
        # no-downgrade guard below, a stale source would instead mean the
        # pin never advances at all). The Dockerfile installs from PyPI,
        # so the published version is exactly what a pin means.
        run: |
          VERSION=$(curl -fsSL https://pypi.org/pypi/clawmetry/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest published OSS version: $VERSION"

      # The cloud Dockerfile does `pip install clawmetry==<version>`, and the
      # cloud PR's CI also installs it to audit routes. On a release commit this
      # job can fire before PyPI has finished propagating the new wheel, so wait
      # for it to be installable before opening/merging the pin PR (avoids a
      # spurious cloud-CI failure that would (correctly) block the auto-merge).
      - name: Wait for version on PyPI
        run: |
          V="${{ steps.oss_version.outputs.version }}"
          for i in $(seq 1 30); do
            if curl -fsSL "https://pypi.org/pypi/clawmetry/$V/json" >/dev/null 2>&1; then
              echo "clawmetry==$V is on PyPI"; exit 0
            fi
            echo "waiting for clawmetry==$V on PyPI (attempt $i)..."; sleep 20
          done
          echo "::warning::clawmetry==$V not on PyPI after wait; continuing (cloud CI will gate the merge)"

      - name: Checkout cloud repo
        uses: actions/checkout@v7
        with:
          repository: vivekchand/clawmetry-cloud
          token: ${{ secrets.CLOUD_REPO_PAT }}
          path: clawmetry-cloud

      # NEVER pin downwards. This job reads __version__ at the TRIGGERING
      # commit, which on a feature merge is the not-yet-bumped previous
      # release — and the pin PR it opens can auto-merge MINUTES AFTER a
      # newer manual pin already deployed, silently rolling prod back.
      # (Burned 2026-07-31: #1842 pinned 0.12.605 at 13:01Z; the stale
      # auto/pin-clawmetry-0.12.597 PR #1843 merged at 13:07Z and reverted
      # the enterprise release off prod.) Belt: exit here when the target
      # is not strictly newer than cloud main's current pin, and close any
      # stale open pin PR for this version. Braces: the cloud repo's
      # pin-no-downgrade CI check red-blocks stale pin PRs at merge time.
      - name: Skip unless strictly newer than cloud's current pin
        env:
          GH_TOKEN: ${{ secrets.CLOUD_REPO_PAT }}
        run: |
          V="${{ steps.oss_version.outputs.version }}"
          CURRENT=$(grep -oE 'clawmetry==[0-9.]+' clawmetry-cloud/Dockerfile | head -1 | cut -d= -f3)
          echo "target=$V cloud-main-pin=$CURRENT"
          newer=$(python3 -c "
          v=tuple(map(int,'$V'.split('.'))); c=tuple(map(int,'$CURRENT'.split('.')))
          print('yes' if v>c else 'no')")
          if [ "$newer" != "yes" ]; then
            echo "Target $V is not newer than the current pin $CURRENT — refusing to pin downwards."
            BRANCH="auto/pin-clawmetry-$V"
            PR=$(gh pr list --repo vivekchand/clawmetry-cloud --head "$BRANCH" --state open --json number -q '.[0].number' || true)
            if [ -n "$PR" ]; then
              gh pr close "$PR" --repo vivekchand/clawmetry-cloud \
                --comment "Stale pin: $V <= current main pin $CURRENT. Closed by the no-downgrade guard." || true
            fi
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Pin clawmetry version in cloud Dockerfile
        if: env.SKIP != '1'
        run: |
          cd clawmetry-cloud
          sed -i "s/clawmetry==[0-9.]*/clawmetry==${{ steps.oss_version.outputs.version }}/" Dockerfile
          grep -q "clawmetry==${{ steps.oss_version.outputs.version }}" Dockerfile || \
            sed -i "s/clawmetry$/clawmetry==${{ steps.oss_version.outputs.version }}/" Dockerfile
          echo "Dockerfile:"; grep clawmetry Dockerfile

      - name: Commit and open PR
        if: env.SKIP != '1'
        run: |
          cd clawmetry-cloud
          git config user.email "diya-bot@clawmetry.com"
          git config user.name "Diya (auto-deploy)"
          BRANCH="auto/pin-clawmetry-${{ steps.oss_version.outputs.version }}"
          git checkout -b "$BRANCH"
          git add Dockerfile
          git diff --staged --quiet && echo "No change needed" && exit 0
          git commit -m "chore: auto-pin clawmetry==${{ steps.oss_version.outputs.version }} from OSS"
          # Force-push: this automation-owned branch may already exist from a
          # prior run for the same version (re-fired release, retried merge).
          # A plain push is rejected ("fetch first") and the whole job goes red,
          # which is why the cloud pin silently drifted. Overwrite is safe.
          git push -f origin "$BRANCH"
          # Idempotent PR create: gh pr create errors if a PR is already open
          # for this head. Skip in that case (the force-push already refreshed
          # the branch, so the existing PR now carries the latest pin).
          if [ -n "$(gh pr list --repo vivekchand/clawmetry-cloud --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            echo "PR already open for $BRANCH; refreshed via force-push."
          else
            gh pr create \
              --repo vivekchand/clawmetry-cloud \
              --title "chore: auto-pin clawmetry==${{ steps.oss_version.outputs.version }}" \
              --body "Automated version pin from OSS release ${{ steps.oss_version.outputs.version }}. Merge to deploy." \
              --base main \
              --head "$BRANCH"
            echo "✅ PR opened to pin clawmetry==${{ steps.oss_version.outputs.version }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.CLOUD_REPO_PAT }}

      # Auto-merge the pin PR once the cloud CI is green so each OSS release
      # deploys to the cloud hands-off. We poll the PR's checks and merge with
      # the PAT (a PAT merge — unlike GITHUB_TOKEN — triggers the cloud's
      # deploy.yml, whose candidate smoke-gate still protects prod before
      # traffic flips). Guards: pin-only diff (Dockerfile), and never merge a
      # PR with a failing or still-pending check. A failed/!pin-only PR is left
      # open for review rather than force-merged.
      - name: Auto-merge pin PR when cloud CI is green
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.CLOUD_REPO_PAT }}
          REPO: vivekchand/clawmetry-cloud
          VERSION: ${{ steps.oss_version.outputs.version }}
        run: |
          BRANCH="auto/pin-clawmetry-${VERSION}"
          PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$PR" ]; then echo "No open pin PR for $BRANCH (pin already current) — nothing to merge."; exit 0; fi
          echo "Pin PR: #$PR"
          # Safety: only auto-merge a pin-only diff. Anything else waits for a human.
          FILES=$(gh pr view "$PR" --repo "$REPO" --json files -q '[.files[].path] | join(",")')
          if [ "$FILES" != "Dockerfile" ]; then
            echo "::warning::PR #$PR touches more than Dockerfile ($FILES) — leaving for manual review."; exit 0
          fi
          # Poll the rollup until every check concludes (or budget runs out).
          # ~45 min budget: the cloud golden-path E2E + MOAT roundtrip checks
          # routinely run 15-20 min, and the earlier 20 min budget timed out
          # before they finished (the pin PR was left open, merged later by
          # hand) — defeating hands-off auto-merge.
          for i in $(seq 1 90); do
            ROLL=$(gh pr view "$PR" --repo "$REPO" --json statusCheckRollup \
                     -q '.statusCheckRollup')
            FAIL=$(echo "$ROLL" | python3 -c "import json,sys; r=json.load(sys.stdin); print(sum(1 for c in r if (c.get('conclusion') or '') in ('FAILURE','CANCELLED','TIMED_OUT','ACTION_REQUIRED')))")
            PEND=$(echo "$ROLL" | python3 -c "import json,sys; r=json.load(sys.stdin); print(sum(1 for c in r if (c.get('status') or c.get('state') or '') in ('IN_PROGRESS','QUEUED','PENDING','EXPECTED')))")
            TOTAL=$(echo "$ROLL" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
            echo "checks: total=$TOTAL fail=$FAIL pending=$PEND (poll $i)"
            if [ "$FAIL" -gt 0 ]; then
              echo "::warning::cloud CI failed on pin PR #$PR — leaving open for review (will retry on next OSS push)."; exit 0
            fi
            if [ "$PEND" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "all checks green — merging #$PR"
              gh pr merge "$PR" --repo "$REPO" --squash --delete-branch && \
                echo "✅ merged #$PR — cloud deploy will run (candidate-gated)"; exit 0
            fi
            sleep 30
          done
          echo "::warning::pin PR #$PR checks did not finish within budget — leaving open."

name: C6 auto-heal (required-checks application)

# Applies required E2E status checks to main branch protection.
# Runs every 2 hours and once daily at 10:15am UTC.
# Self-heals C6 within 2 hours after E2E_ADMIN_PAT secret is added.
#
# When E2E_ADMIN_PAT is NOT set:
#   - reads current branch protection state (read-only, no admin needed)
#   - if clawmetry/main checks already configured: exits 0 (C6 green)
#   - if checks not yet configured: emits ::error:: annotation and exits 1
#     (red badge acts as a forcing signal until the admin acts)
#
# When E2E_ADMIN_PAT IS set:
#   - runs scripts/apply_required_status_checks.py to configure checks
#   - writes a post-apply summary
#
# Cross-repo reads (clawmetry-cloud, clawmetry-landing):
#   GITHUB_TOKEN returns 403 for private cross-repo reads. This is expected,
#   NOT a bug. Those repos are shown as "cannot verify" in the summary and
#   do NOT affect the ALL_OK gate. Only clawmetry/main (same-repo, readable)
#   drives the pass/fail decision. Mirrors c6-health.yml read_protection().
#
# Fastest close paths (no waiting for this schedule):
#
#   Option A (Settings UI, 60 s, browser only):
#     https://github.com/vivekchand/clawmetry/settings/branches
#     > edit main > Require status checks > add check names below.
#     Also update clawmetry-cloud/main and clawmetry-landing/main.
#
#   Option B (Actions one-shot, PAT paste):
#     Actions > "Apply required E2E status checks (C6 -- one-shot)"
#     confirm=APPLY, pat_token=<PAT> > Run workflow
#     PAT creation: https://github.com/settings/personal-access-tokens/new?name=clawmetry-c6
#     Permissions: Administration read+write on clawmetry/clawmetry-cloud/clawmetry-landing
#
#   Option C (terminal, 30 s, now zero-prerequisites):
#     bash scripts/close-c6.sh
#     (auto-installs gh CLI on macOS/Ubuntu if needed)
#
#   Option D (set-and-forget -- this workflow does the rest):
#     Settings > Secrets > Actions > New secret: E2E_ADMIN_PAT
#     Value: same PAT from Option B
#     This workflow picks it up within 2 hours and closes C6.
#
# Tracking: vivekchand/clawmetry#4029

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours -- heals within 2h of E2E_ADMIN_PAT being set
    - cron: '15 10 * * *'   # 10:15am UTC daily (kept for predictability)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c6-auto-heal:
    name: C6 auto-heal (apply required checks if E2E_ADMIN_PAT is set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for admin token
        id: pat-check
        env:
          ADMIN_PAT: ${{ secrets.E2E_ADMIN_PAT }}
        run: |
          if [ -z "${ADMIN_PAT}" ]; then
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
            echo "E2E_ADMIN_PAT found -- applying required E2E status checks."
          fi

      # Read-only audit: verify clawmetry/main has the required E2E status
      # checks configured. Reads from both 'contexts' (legacy, written by
      # API/script) AND 'checks' (current, written by GitHub Settings UI).
      #
      # Only clawmetry/main (same-repo) drives ALL_OK. clawmetry-cloud and
      # clawmetry-landing are private repos -- GITHUB_TOKEN returns 403 for
      # cross-repo branch-protection reads. Treating them as "missing" was
      # a false-negative bug: ALL_OK was always false even after the admin
      # configured clawmetry/main, so the "C6 already configured" step below
      # could never fire and the schedule produced perpetual red noise.
      # Fix (mirrors c6-health.yml read_protection()): cross-repo repos are
      # shown as ":grey_question: cannot verify" in the summary and do NOT
      # set ALL_OK=false.
      - name: Read current required-check state (read-only)
        id: read-state
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: vivekchand
        run: |
          set +e

          # clawmetry/main: same-repo, GITHUB_TOKEN can read it -- authoritative.
          # clawmetry-cloud/clawmetry-landing: private repos, 403 expected --
          # shown as "cannot verify" but do NOT affect ALL_OK.
          REPOS_AUTH="clawmetry"
          REPOS_CROSS="clawmetry-cloud clawmetry-landing"

          # Expected required checks per repo (keep in sync with
          # scripts/apply_required_status_checks.py and c6-health.yml).
          declare -A EXPECTED
          EXPECTED[clawmetry]="OSS golden path (wheel + OpenClaw + 9 tabs)|Cross-repo handoff (C4)|MOAT Keystone (13-endpoint bar)|E2E Browser Tests (critical subset)"
          EXPECTED[clawmetry-cloud]="Cloud golden-path browser E2E"
          EXPECTED[clawmetry-landing]="Landing golden path (C3)"

          ALL_OK=true
          SUMMARY_ROWS=""

          # Authoritative loop: only clawmetry/main drives ALL_OK.
          for REPO in $REPOS_AUTH; do
            PROTECTION=$(gh api "/repos/${OWNER}/${REPO}/branches/main" 2>/dev/null | \
              python3 -c "
import json, sys
try:
    data = json.load(sys.stdin)
    prot = (data.get('protection') or {})
    rsc = (prot.get('required_status_checks') or {})
    ctx = set(rsc.get('contexts') or [])
    for item in (rsc.get('checks') or []):
        if isinstance(item, dict) and item.get('context'):
            ctx.add(item['context'])
    print(json.dumps(sorted(ctx)))
except Exception:
    print('[]')
" || echo "[]")
            IFS='|' read -ra EXPECTED_CHECKS <<< "${EXPECTED[$REPO]}"
            for CHECK in "${EXPECTED_CHECKS[@]}"; do
              if echo "$PROTECTION" | python3 -c \
                "import json,sys; d=json.load(sys.stdin); exit(0 if $(python3 -c "import json; print(repr('${CHECK}'))" 2>/dev/null || echo "'${CHECK}'") in d else 1)" 2>/dev/null; then
                ICON=":white_check_mark:"
              else
                ICON=":x:"
                ALL_OK=false
              fi
              SUMMARY_ROWS="${SUMMARY_ROWS}| ${REPO} | ${CHECK} | ${ICON} |\n"
            done
          done

          # Cross-repo loop: GITHUB_TOKEN returns 403 for private repos.
          # Mark as "cannot verify" -- do NOT set ALL_OK=false.
          for REPO in $REPOS_CROSS; do
            IFS='|' read -ra EXPECTED_CHECKS <<< "${EXPECTED[$REPO]}"
            for CHECK in "${EXPECTED_CHECKS[@]}"; do
              SUMMARY_ROWS="${SUMMARY_ROWS}| ${REPO} | ${CHECK} | :grey_question: cannot verify (cross-repo) |\n"
            done
          done

          {
            echo "## C6: Required E2E Status Checks"
            echo ""
            if [ "$ALL_OK" = "true" ]; then
              echo "> :white_check_mark: **clawmetry/main: all required checks configured.** C6 gate is GREEN."
              echo ">"
              echo "> clawmetry-cloud and clawmetry-landing cannot be verified cross-repo (private repos --"
              echo "> GITHUB_TOKEN scope limit). Use \`bash scripts/close-c6.sh\` or the Settings UI"
              echo "> to confirm those repos are also covered."
            else
              echo "> :x: **clawmetry/main: one or more required checks are not yet enforced.**"
              echo ">"
              echo "> E2E tests pass but PRs can still merge if they fail -- the checks are not required."
            fi
            echo ""
            echo "| Repo | Check | Status |"
            echo "|------|-------|--------|"
            printf "%b" "$SUMMARY_ROWS"
            echo ""
            if [ "$ALL_OK" != "true" ]; then
              echo "### Close C6 now (pick one)"
              echo ""
              echo "**Option A -- GitHub Settings UI (no PAT, no tools, ~60 s):**"
              echo "Add the check names directly in Settings > Branches. GitHub autocompletes from recent CI runs."
              echo "1. [clawmetry Settings > Branches](https://github.com/vivekchand/clawmetry/settings/branches)"
              echo "   -- edit main, enable \"Require status checks to pass\", add:"
              echo "   - \`OSS golden path (wheel + OpenClaw + 9 tabs)\`"
              echo "   - \`Cross-repo handoff (C4)\`"
              echo "   - \`MOAT Keystone (13-endpoint bar)\`"
              echo "   - \`E2E Browser Tests (critical subset)\`"
              echo "2. [clawmetry-cloud Settings > Branches](https://github.com/vivekchand/clawmetry-cloud/settings/branches)"
              echo "   -- add \`Cloud golden-path browser E2E\`"
              echo "3. [clawmetry-landing Settings > Branches](https://github.com/vivekchand/clawmetry-landing/settings/branches)"
              echo "   -- add \`Landing golden path (C3)\`"
              echo ""
              echo "**Option B -- one-shot via Actions workflow (fine-grained PAT with Administration: write):**"
              echo "1. [Create PAT](https://github.com/settings/personal-access-tokens/new?name=clawmetry-c6)"
              echo "   (repos: clawmetry/clawmetry-cloud/clawmetry-landing, permission: Administration read+write)"
              echo "2. [Run Apply workflow](https://github.com/vivekchand/clawmetry/actions/workflows/apply-required-checks.yml)"
              echo "   -- \`confirm=APPLY\`, \`pat_token=<PAT>\` -- closes all 3 repos in one run"
              echo ""
              echo "**Option C -- terminal (zero prerequisites, auto-installs gh CLI on macOS/Ubuntu):**"
              echo '```bash'
              echo "bash scripts/close-c6.sh"
              echo '```'
              echo ""
              echo "**Option D -- store PAT as secret (this workflow heals within 2 hours):**"
              echo "- [Settings > Secrets > New secret](https://github.com/vivekchand/clawmetry/settings/secrets/actions/new)"
              echo "  Name: \`E2E_ADMIN_PAT\`, Value: same PAT from Option B"
              echo ""
              echo "Tracking: [#4029](https://github.com/vivekchand/clawmetry/issues/4029)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Export for downstream steps.
          echo "checks_ok=${ALL_OK}" >> "$GITHUB_OUTPUT"

      # Fires when clawmetry/main has all required checks configured.
      # Previously this step could never fire because ALL_OK was always false
      # (cross-repo 403 falsely appeared as "missing"). Fixed above.
      - name: C6 already configured (no PAT needed)
        if: steps.read-state.outputs.checks_ok == 'true'
        run: |
          echo "C6 is GREEN -- all required E2E status checks are configured on clawmetry/main."
          echo "Branch protection is correctly set. E2E_ADMIN_PAT is not needed."
          echo "Tracking: https://github.com/vivekchand/clawmetry/issues/4029"

      - name: Error: E2E_ADMIN_PAT not set
        if: steps.pat-check.outputs.has_pat == 'false' && steps.read-state.outputs.checks_ok != 'true'
        run: |
          echo "::error::E2E_ADMIN_PAT secret is not set -- C6 (required-status-checks) cannot be applied automatically."
          echo ""
          echo "ACTION REQUIRED: Add E2E_ADMIN_PAT to close C6."
          echo "See the job summary above for a formatted status report and close options."
          echo "Tracking: https://github.com/vivekchand/clawmetry/issues/4029"
          exit 1

      - name: Apply required E2E status checks (C6)
        if: steps.pat-check.outputs.has_pat == 'true' && steps.read-state.outputs.checks_ok != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.E2E_ADMIN_PAT }}
        run: python3 scripts/apply_required_status_checks.py

      - name: Post-apply summary
        if: steps.pat-check.outputs.has_pat == 'true' && steps.read-state.outputs.checks_ok != 'true'
        run: |
          {
            echo "## C6 auto-heal: required checks applied"
            echo ""
            echo "> :white_check_mark: E2E_ADMIN_PAT was present. \`apply_required_status_checks.py\` ran."
            echo "> Branch protection is now configured on \`main\` for all 3 repos."
            echo ""
            echo "Verify at:"
            echo "- [clawmetry branch protection](https://github.com/vivekchand/clawmetry/settings/branches)"
            echo "- [clawmetry-cloud branch protection](https://github.com/vivekchand/clawmetry-cloud/settings/branches)"
            echo "- [clawmetry-landing branch protection](https://github.com/vivekchand/clawmetry-landing/settings/branches)"
            echo ""
            echo "Tracking: [#4029](https://github.com/vivekchand/clawmetry/issues/4029)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "C6 auto-heal complete. Tracking: https://github.com/vivekchand/clawmetry/issues/4029"

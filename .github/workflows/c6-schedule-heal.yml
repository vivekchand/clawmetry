name: C6 auto-heal (required-checks application)

# Applies required E2E status checks to main branch protection.
# Runs every 2 hours and once daily at 10:15am UTC.
# Self-heals C6 within 2 hours after E2E_ADMIN_PAT secret is added.
#
# NOTE: Push trigger scoped to this file only (paths: c6-schedule-heal.yml,
# 2026-08-05). A push trigger is required for the job-level `if` guard to
# take effect: without a push trigger in `on:`, GitHub creates a phantom
# 0-job run on any push that touches this file, and that run concludes as
# "failure". With the push trigger defined AND the job-level `if` guard
# (schedule|workflow_dispatch only), the job is SKIPPED on push events and
# the run concludes as "success" (skipped). The paths filter limits trigger
# scope to modifications of this file only -- no queue pressure from normal
# code pushes. See PR #4553 and issue #4029.
#
# Schedule paused: 2026-07-20 (GitHub auto-paused after consecutive failures
# that predated C6 branch protection being configured on 2026-07-31).
# Schedule re-enabled: 2026-08-06 (this push re-enables it; per GitHub docs,
# any push that modifies a workflow file un-pauses a paused schedule).
#
# When E2E_ADMIN_PAT is NOT set:
#   - reads current branch protection state (read-only, no admin needed)
#   - if clawmetry/main checks already configured: exits 0 (C6 green)
#   - if checks not yet configured on schedule: emits ::error:: annotation and exits 1
#     (red badge acts as a forcing signal until the admin acts)
#
# When E2E_ADMIN_PAT IS set:
#   - runs scripts/apply_required_status_checks.py to configure checks
#   - writes a post-apply summary
#
# Cross-repo reads (clawmetry-cloud, clawmetry-landing):
#   GITHUB_TOKEN returns 403 for private cross-repo reads. This is expected,
#   NOT a bug. Those repos are shown as "cannot verify" in the summary and
#   do NOT affect the ALL_OK gate. Only clawmetry/main (same-repo, readable)
#   drives the pass/fail decision. Mirrors c6-health.yml read_protection().
#
# Fastest close paths (no waiting for this schedule):
#
#   Option A (Settings UI, 60 s, browser only):
#     https://github.com/vivekchand/clawmetry/settings/branches
#     > edit main > Require status checks > add:
#       E2E Gate (required)
#     Also update clawmetry-cloud/main and clawmetry-landing/main.
#
#   Option B (Actions one-shot, PAT paste):
#     Actions > "Apply required E2E status checks (C6 -- one-shot)"
#     confirm=APPLY, pat_token=<PAT> > Run workflow
#     PAT creation: https://github.com/settings/personal-access-tokens/new?name=clawmetry-c6
#     Permissions: Administration read+write on clawmetry/clawmetry-cloud/clawmetry-landing
#
#   Option C (terminal, 30 s, now zero-prerequisites):
#     bash scripts/close-c6.sh
#     (auto-installs gh CLI on macOS/Ubuntu if needed)
#
#   Option D (set-and-forget -- this workflow does the rest):
#     Settings > Secrets > Actions > New secret: E2E_ADMIN_PAT
#     Value: same PAT from Option B
#     This workflow picks it up within 2 hours and closes C6.
#
# Tracking: vivekchand/clawmetry#4552

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours -- heals within 2h of E2E_ADMIN_PAT being set
    - cron: '15 10 * * *'   # 10:15am UTC daily (kept for predictability)
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/c6-schedule-heal.yml'

# Prevent two schedule/dispatch runs from overlapping.
concurrency:
  group: c6-schedule-heal-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  c6-auto-heal:
    name: C6 auto-heal (apply required checks if E2E_ADMIN_PAT is set)
    runs-on: ubuntu-latest
    # Guard: only execute on the events this workflow actively uses (schedule
    # and workflow_dispatch). The push trigger is defined solely so that when
    # a PR touches this file, GitHub runs the workflow with event=push and
    # evaluates this `if:` -- which returns false, causing the job to be
    # SKIPPED. A run with a skipped job concludes as "success", eliminating
    # the phantom 0-job failure badge that occurred before the push trigger
    # was added. See PR #4553.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for admin token
        id: pat-check
        env:
          ADMIN_PAT: ${{ secrets.E2E_ADMIN_PAT }}
        run: |
          if [ -z "${ADMIN_PAT}" ]; then
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
            echo "E2E_ADMIN_PAT found -- applying required E2E status checks."
          fi

      # Read-only audit: verify clawmetry/main has the required E2E status
      # checks configured. Reads from both 'contexts' (legacy, written by
      # API/script) AND 'checks' (current, written by GitHub Settings UI).
      #
      # Only clawmetry/main (same-repo) drives ALL_OK. clawmetry-cloud and
      # clawmetry-landing are private repos -- GITHUB_TOKEN returns 403 for
      # cross-repo branch-protection reads. Treating them as "missing" was
      # a false-negative bug: ALL_OK was always false even after the admin
      # configured clawmetry/main, so the "C6 already configured" step below
      # could never fire and the schedule produced perpetual red noise.
      # Fix (mirrors c6-health.yml read_protection()): cross-repo repos are
      # shown as ":grey_question: cannot verify" in the summary and do NOT
      # set ALL_OK=false.
      # Read-only audit: is `E2E Gate (required)` actually configured on
      # clawmetry/main? Reads classic branch protection ('contexts' + 'checks')
      # AND the Rulesets API, since either path can carry the requirement.
      #
      # The logic lives in scripts/c6_required_checks_status.py rather than
      # inline. It used to be an inline `python3 -c "` block whose Python body
      # sat at column 0, which terminated this `run: |` literal block and made
      # the whole workflow unparseable -- so it failed at STARTUP on every run
      # and the C6 watchdog never actually ran. tests/test_workflow_yaml_valid.py
      # now parses every workflow so that class cannot come back.
      #
      # Only clawmetry/main is authoritative. GITHUB_TOKEN gets 403 on the
      # private sibling repos, and counting a 403 as "missing" was a real
      # false-negative that kept C6 permanently red.
      - name: Read current required-check state (read-only)
        id: read-state
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: vivekchand
        run: python3 scripts/c6_required_checks_status.py

      # Fires when clawmetry/main has all required checks configured.
      - name: C6 already configured (no PAT needed)
        if: steps.read-state.outputs.checks_ok == 'true'
        run: |
          echo "C6 is GREEN -- all required E2E status checks are configured on clawmetry/main."
          echo "Branch protection is correctly set. E2E_ADMIN_PAT is not needed."
          echo "Tracking: https://github.com/vivekchand/clawmetry/issues/4552"

      # Daily ping on the tracking issue when C6 is still unclosed.
      # Runs only on the 10:15 UTC daily schedule (not every 2-hour run)
      # so the issue thread does not flood with hourly noise.
      # continue-on-error: true so a GitHub API hiccup does not shadow
      # the mandatory exit-1 below.
      - name: Daily ping on tracking issue (C6 still unclosed)
        if: |
          github.event_name == 'schedule'
          && github.event.schedule == '15 10 * * *'
          && steps.pat-check.outputs.has_pat == 'false'
          && steps.read-state.outputs.checks_ok != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          BODY="<!-- c6-daily-ping --> **C6 daily ping ${TODAY}:** clawmetry/main branch protection does not yet require E2E checks. 6/7 criteria green. Fastest close: [Settings > Branches > main](https://github.com/vivekchand/clawmetry/settings/branches) > Required status checks > add \`E2E Gate (required)\` (60 s, no token needed). Or run \`bash scripts/close-c6.sh\` from a terminal."
          gh issue comment 4552 --repo vivekchand/clawmetry --body "$BODY"

      # Exit 1 only on schedule (never on push -- this workflow is informational on push).
      # Signals to the admin that E2E_ADMIN_PAT is needed to auto-heal C6.
      # Quoted: an unquoted scalar containing ": " parses as a nested mapping
      # ("mapping values are not allowed here") and fails the workflow at startup.
      - name: "Error: E2E_ADMIN_PAT not set"
        if: |
          steps.pat-check.outputs.has_pat == 'false'
          && steps.read-state.outputs.checks_ok != 'true'
          && github.event_name != 'push'
        run: |
          echo "::error::E2E_ADMIN_PAT secret is not set -- C6 (required-status-checks) cannot be applied automatically."
          echo ""
          echo "ACTION REQUIRED: Add E2E_ADMIN_PAT to close C6."
          echo "See the job summary above for a formatted status report and close options."
          echo "Tracking: https://github.com/vivekchand/clawmetry/issues/4552"
          exit 1

      - name: Apply required E2E status checks (C6)
        if: steps.pat-check.outputs.has_pat == 'true' && steps.read-state.outputs.checks_ok != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.E2E_ADMIN_PAT }}
        run: python3 scripts/apply_required_status_checks.py

      - name: Post-apply summary
        if: steps.pat-check.outputs.has_pat == 'true' && steps.read-state.outputs.checks_ok != 'true'
        run: |
          {
            echo "## C6 auto-heal: required checks applied"
            echo ""
            echo "> :white_check_mark: E2E_ADMIN_PAT was present. \`apply_required_status_checks.py\` ran."
            echo "> Branch protection is now configured on \`main\` for all 3 repos."
            echo ""
            echo "Verify at:"
            echo "- [clawmetry branch protection](https://github.com/vivekchand/clawmetry/settings/branches)"
            echo "- [clawmetry-cloud branch protection](https://github.com/vivekchand/clawmetry-cloud/settings/branches)"
            echo "- [clawmetry-landing branch protection](https://github.com/vivekchand/clawmetry-landing/settings/branches)"
            echo ""
            echo "Tracking: [#4552](https://github.com/vivekchand/clawmetry/issues/4552)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "C6 auto-heal complete. Tracking: https://github.com/vivekchand/clawmetry/issues/4552"

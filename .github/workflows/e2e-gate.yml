name: E2E Gate (required)

# Aggregates the 4 required OSS E2E checks into one required status check.
# The owner adds ONE check name to branch protection instead of four:
#   "E2E Gate (required)"
#
# Polls the Check Runs API every 30s until all required checks complete.
# Fails immediately if any required check fails (fast-fail).
# Passes only when all 4 required checks have a success conclusion.
# Times out after 15 min (oss-golden-path budget is 12 min -- on a cold
# runner Playwright download alone takes ~4.5 min, then C1+C5 sweeps add
# ~5 min; the previous 8-min limit caused premature timeout before the
# underlying check could pass).
#
# Required checks aggregated (keep in sync with REQUIRED_CHECKS in
# scripts/apply_required_status_checks.py):
#   - OSS golden path (wheel + OpenClaw + 9 tabs)
#   - Cross-repo handoff (C4)
#   - MOAT Keystone (13-endpoint bar)
#   - E2E Browser Tests (critical subset)
#
# To close C6 after this PR merges:
#   GitHub Settings > Branches > main > Required status checks:
#   add "E2E Gate (required)"
#   (1 check name instead of 4)
#
# Tracking: vivekchand/clawmetry#4029 (C6)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  e2e-gate:
    name: E2E Gate (required)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # Required because the gate logic is a repo script now. This job had no
      # checkout while the logic was an inline heredoc, which needs nothing
      # from the working tree -- converting it to a script call silently broke
      # that assumption and the gate died with "No such file or directory".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gate logic lives in scripts/e2e_gate.py so it can be unit-tested
      # (tests/test_e2e_gate.py) instead of only being exercised in anger on a
      # real PR. That file is the merge gate: a check not listed in its
      # REQUIRED_SPECS cannot block a merge, however good its test is.
      - name: Wait for required checks and verify they passed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          MAX_WAIT: "1800"
        run: python3 scripts/e2e_gate.py

      - name: Write job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## E2E Gate"
            echo ""
            echo "Checked commit: \`${COMMIT_SHA:0:12}\`"
            echo ""
            echo "Required checks (derived from scripts/e2e_gate.py):"
            echo ""
            echo '```'
            python3 scripts/e2e_gate.py --list
            echo '```'
            echo ""
            echo "This single context, **E2E Gate (required)**, is the only name"
            echo "in branch protection. Everything above is aggregated through it."
          } >> "$GITHUB_STEP_SUMMARY"
# ci-trigger (auto-mergeability sweep 2026-08-14)

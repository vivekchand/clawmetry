name: E2E Gate (required)

# Aggregates the 12 required CI and E2E checks into one required status check.
# The owner adds ONE check name to branch protection instead of twelve:
#   "E2E Gate (required)"
#
# Polls the Check Runs API every 30s until all required checks complete.
# Fails immediately if any required check fails (fast-fail).
# Passes only when all required checks have a success conclusion.
# Times out after 60 min (scripts/e2e_gate.py MAX_WAIT=3600). This ceiling
# exists to handle runner starvation on days with many concurrent PRs; on a
# quiet day the gate exits as soon as all checks pass, typically in 20-30 min.
#
# Required checks aggregated (authoritative list: scripts/e2e_gate.py):
#   - OSS golden path (wheel + OpenClaw + 9 tabs)
#   - Cross-repo handoff (C4)
#   - MOAT Keystone (13-endpoint bar)
#   - E2E Browser Tests (critical subset)
#   - Syntax & Lint
#   - API Tests (3 OS)
#   - MOAT Verifier (72 tests)
#   - Entitlement API tests
#   - pip install matrix (x4)
#   - Wheel install & asset presence
#   - Store invariants (property-based)
#   - PR cites the product record that justified it
#
# The functional checks and portable product-record citation gate run on PRs.
# Independent exact-candidate review is documented in docs/PRODUCT_RECORDS.md.
# Retired third-party review services are not required contexts.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: e2e-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  e2e-gate:
    name: E2E Gate (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    steps:
      # Required because the gate logic is a repo script now. This job had no
      # checkout while the logic was an inline heredoc, which needs nothing
      # from the working tree -- converting it to a script call silently broke
      # that assumption and the gate died with "No such file or directory".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0

      # Recheck this event's body synchronously. Otherwise an edited PR body
      # can reuse a prior successful citation check on the same commit SHA.
      - name: Validate the current product-record citation
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_product_record.py

      # The gate logic lives in scripts/e2e_gate.py so it can be unit-tested
      # (tests/test_e2e_gate.py) instead of only being exercised in anger on a
      # real PR. That file is the merge gate: a check not listed in its
      # REQUIRED_SPECS cannot block a merge, however good its test is.
      - name: Wait for required checks and verify they passed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          MAX_WAIT: "3600"
          # Pass the PR author so the gate can waive heavy E2E checks that
          # never run on dependabot frontend/deps bumps (path-filtered out).
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/e2e_gate.py

      - name: Write job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## E2E Gate"
            echo ""
            echo "Checked commit: \`${COMMIT_SHA:0:12}\`"
            echo ""
            echo "Required checks (derived from scripts/e2e_gate.py):"
            echo ""
            echo '```'
            python3 scripts/e2e_gate.py --list
            echo '```'
            echo ""
            echo "This single context, **E2E Gate (required)**, is the only name"
            echo "in branch protection. Everything above is aggregated through it."
          } >> "$GITHUB_STEP_SUMMARY"

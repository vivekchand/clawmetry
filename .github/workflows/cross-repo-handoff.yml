name: Cross-repo handoff (C4)

# C4 gate: landing signup -> cloud boot -> daemon pair -> first sync event lands.
# Hard gate: no continue-on-error. Budget: 10 min.
# Tracking: vivekchand/clawmetry#1646 (C4)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cross-repo-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-repo-handoff:
    name: Cross-repo handoff (C4)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout clawmetry (OSS)
        uses: actions/checkout@v7
        with:
          path: oss

      # CLOUD_REPO_PAT is NOT exposed to pull_request runs from a fork (GitHub
      # withholds repo secrets from fork PRs to prevent exfiltration). Without it
      # neither clawmetry-cloud nor clawmetry-landing (both private) can be
      # checked out. All four C4 tiers (T1-T4) still run via inline stubs;
      # the private checkouts provide higher-fidelity T3/T4 when PAT is present.
      - name: Detect cloud-repo access
        id: access
        env:
          CLOUD_REPO_PAT: ${{ secrets.CLOUD_REPO_PAT }}
        run: |
          if [ -n "$CLOUD_REPO_PAT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=C4 cloud checkout unavailable::CLOUD_REPO_PAT is not set (fork PR or secret not configured). T2/T3/T4 will use inline stubs -- all four tiers still run."
          fi

      # clawmetry-landing is a private repo -- requires CLOUD_REPO_PAT (which
      # covers all repos owned by vivekchand). Gated on access.available so fork
      # PRs skip gracefully; the test falls back to its inline stub in that case.
      - name: Checkout clawmetry-landing
        if: steps.access.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: vivekchand/clawmetry-landing
          token: ${{ secrets.CLOUD_REPO_PAT }}
          path: landing

      # Cloud repo provides run_cloud.py stub + DaemonSim wire-format simulator.
      - name: Checkout clawmetry-cloud
        if: steps.access.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: vivekchand/clawmetry-cloud
          token: ${{ secrets.CLOUD_REPO_PAT }}
          path: cloud

      - name: Patch run_cloud.py throttle stub (node_id kwarg compat)
        if: steps.access.outputs.available == 'true'
        run: |
          python - <<'EOF'
          import pathlib
          p = pathlib.Path("cloud/tests/e2e_browser/run_cloud.py")
          if not p.exists():
              print("run_cloud.py not found -- skipping patch")
              exit(0)
          t = p.read_text()
          t = t.replace(
              "def _throttle_patched(token):",
              "def _throttle_patched(token, node_id=None):"
          ).replace(
              "return _orig_throttle(token)",
              "return _orig_throttle(token, node_id=node_id)"
          )
          p.write_text(t)
          print("patched _throttle_patched: added node_id kwarg")
          EOF

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest requests cryptography waitress

      - name: Install cloud deps
        if: steps.access.outputs.available == 'true'
        run: |
          # psycopg2 must be importable (DB is monkey-patched, never called)
          pip install psycopg2-binary
          pip install -r cloud/requirements.txt || true

      - name: Run C4 cross-repo handoff
        env:
          CLAWMETRY_E2E_STUB_AUTH: "1"
          LANDING_CHECKOUT_PATH: ${{ github.workspace }}/landing/clawmetry-landing
        run: |
          cd "${{ github.workspace }}"
          python -m pytest oss/tests/test_e2e_cross_repo_handoff.py \
            -v --tb=short \
            --junitxml=/tmp/junit-c4-${{ github.run_id }}.xml

      # Post a Markdown fidelity table to the Actions job summary so every
      # PR reviewer can see at a glance whether C4 ran with real apps or
      # inline stubs. In stub mode a one-liner call-to-action links to the
      # tracking issue so the gap is visible without digging into logs.
      # Tracking: vivekchand/clawmetry#3970 (C4)
      - name: Write C4 fidelity summary
        if: always()
        run: |
          {
            echo "## C4 Cross-Repo Handoff: Fidelity Report"
            echo ""
            if [ "${{ steps.access.outputs.available }}" = "true" ]; then
              echo "**Mode: REAL APPS** -- CLOUD_REPO_PAT configured"
              echo ""
              echo "| Tier | What was tested |"
              echo "|------|------------------|"
              echo "| T1 | Real clawmetry-landing (run_landing.py) |"
              echo "| T2 | Real clawmetry-cloud (run_cloud.py) |"
              echo "| T3 | Real DaemonSim from cloud checkout |"
              echo "| T4 | Real DaemonSim + AES-256-GCM cache_push |"
            else
              echo "**Mode: STUB** -- CLOUD_REPO_PAT not set (fork PR or secret not configured)"
              echo ""
              echo "| Tier | What was tested | Full-fidelity equivalent |"
              echo "|------|-----------------|-------------------------|"
              echo "| T1 | Inline landing stub | Real app via run_landing.py |"
              echo "| T2 | Inline cloud stub | Real app via run_cloud.py |"
              echo "| T3 | InlineDaemonSim | Real DaemonSim from cloud checkout |"
              echo "| T4 | InlineDaemonSim + cache_push | Real DaemonSim + AES-256-GCM payload |"
              echo ""
              echo "> **To upgrade C4 to real-apps mode:** set the \`CLOUD_REPO_PAT\` repository"
              echo "> secret (Contents read on clawmetry-cloud + clawmetry-landing)."
              echo "> See [tracking issue #3970](https://github.com/vivekchand/clawmetry/issues/3970)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit results
        if: always() && steps.access.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: junit-c4-${{ github.run_id }}
          path: /tmp/junit-c4-${{ github.run_id }}.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== cloud server log ==="
          cat /tmp/c4-cloud.log 2>/dev/null | tail -200 || true
          echo "=== landing server log ==="
          cat /tmp/c4-landing.log 2>/dev/null | tail -200 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: c4-handoff-logs
          path: |
            /tmp/c4-cloud.log
            /tmp/c4-landing.log
          if-no-files-found: warn
          retention-days: 7

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Every job here only reads the repository: checkout, install, run tests,
# upload an artifact. Nothing calls the GitHub API with GITHUB_TOKEN, pushes
# a commit, tags, comments on a PR or touches a Release, so the whole
# file is safe with the most restrictive permissions possible.
permissions:
  contents: read

# Cancel in-progress CI runs for the same PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAWMETRY_URL: http://localhost:8900
  CLAWMETRY_TOKEN: test-token-ci
  CI: 1

jobs:
  # ─── 1. Syntax, Lint & drift guards ──────────────────────────────────────────
  syntax-lint:
    name: "Syntax & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install lint deps
        run: pip install flask duckdb cryptography waitress
      - name: Python syntax check (all .py files)
        run: |
          python3 -m py_compile dashboard.py
          find . -name '*.py' -not -path './.git/*' -not -path './node_modules/*' | \
            xargs python3 -m py_compile
      - name: JavaScript syntax check
        run: node --check clawmetry/static/js/app.js
      - name: Lint — runtime count in sync with entitlements
        run: python3 scripts/sync_runtime_count.py --check
      - name: Lint — module map in sync with codebase
        run: python3 scripts/gen_module_map.py --check
      - name: Lint — query contract doc in sync
        run: python3 scripts/gen_query_contract_doc.py --check
      - name: Lint — framework coverage doc in sync
        run: python3 scripts/gen_framework_coverage.py --check
      - name: Lint — daemon allowlist covers all /api/local/* routes
        run: make lint-daemon-allowlist
      - name: Lint — no py3.9 annotation syntax in source
        run: python3 scripts/lint_py39_annotations.py
      - name: Lint — acceptance criteria coverage (ratchet)
        run: python3 scripts/check_ac_coverage.py --check
      - name: Lint — product record citation check
        run: python3 scripts/check_product_record.py --check
      - name: Lint — every test file is named in a CI step
        run: |
          python3 scripts/check_ci_test_coverage.py \
            --ci .github/workflows/ci.yml \
            --testdir tests/
      - name: Lint — no em-dash or double-dash in user-facing copy
        run: python3 scripts/lint_emdash.py
      - name: Lint — JS parse (all .js files)
        run: |
          find clawmetry/static/js -name '*.js' | xargs -I{} node --check {}

  # ─── 2. Assessment privacy guard ─────────────────────────────────────────────
  assessment-privacy:
    name: "Assessment privacy (${{ matrix.os }}, Python ${{ matrix.python-version }})"
    needs: syntax-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install flask duckdb cryptography waitress
      - name: Assessment privacy
        run: |
          python3 -m pytest \
            tests/test_assessment_no_plaintext_egress.py \
            tests/test_assessment_response_private.py \
            tests/test_assessment_encrypted_snapshot.py \
            -v --tb=short

  # ─── 3. Frontend bundle ───────────────────────────────────────────────────────
  frontend-bundle:
    name: "Frontend bundle (npm ci + vite build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  # ─── 4. Full test matrix (Ubuntu + macOS + Windows × Python 3.9 + 3.11) ──────
  tests:
    name: "Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})"
    needs: syntax-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install flask duckdb cryptography waitress
      - name: Core tests
        run: |
          python3 -m pytest \
            tests/test_overview_endpoint.py \
            tests/test_sessions_endpoint.py \
            tests/test_usage_endpoint.py \
            tests/test_health_endpoint.py \
            tests/test_brain_endpoint.py \
            tests/test_flow_endpoint.py \
            tests/test_entitlement_endpoint.py \
            tests/test_guard_endpoint.py \
            tests/test_signals_endpoint.py \
            tests/test_trail_endpoint.py \
            tests/test_crons_endpoint.py \
            tests/test_alerts_endpoint.py \
            tests/test_budget_endpoint.py \
            tests/test_node_activity_endpoint.py \
            tests/test_apikeys_endpoint.py \
            tests/test_public_api_endpoint.py \
            tests/test_hooks_endpoint.py \
            tests/test_infra_endpoint.py \
            tests/test_meta_endpoint.py \
            tests/test_nemoclaw_endpoint.py \
            tests/test_tracing_endpoint.py \
            tests/test_fleet_history_endpoint.py \
            tests/test_local_query_endpoint.py \
            tests/test_components_endpoint.py \
            tests/test_channels_endpoint.py \
            tests/test_runtime_ingest_endpoint.py \
            -v --tb=short

  # ─── 5. Deeper unit tests ─────────────────────────────────────────────────────
  unit-tests:
    name: "Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})"
    needs: syntax-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps

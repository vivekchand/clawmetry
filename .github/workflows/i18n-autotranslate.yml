name: i18n autotranslate

# Fans new/changed English keys out to every enabled locale via the Claude API,
# then opens a "chore(i18n): sync translations" PR. English (en.json) is the
# single source of truth. Idempotent: only the delta is translated.
# Uses the Claude Code CLI (no API key). Set CLAUDE_CODE_OAUTH_TOKEN (from
# `claude setup-token`) as a repo secret, or run the script locally where Claude
# Code is signed in. Skips gracefully if the token is unset.

on:
  push:
    branches: [main]
    paths:
      - 'clawmetry/static/locales/en.json'
      - 'clawmetry/static/locales/_meta.json'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated locale codes to translate (blank = all enabled)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  autotranslate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Claude Code subscription token (from `claude setup-token`), NOT an Anthropic API key.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # need the previous en.json to detect CHANGED keys
          # Nothing in this job pushes from this working copy. The only git
          # operation that reaches the network is the `Open sync PR` step, and
          # peter-evans/create-pull-request configures its own credential from
          # its `token` input (default `${{ github.token }}`) -- it unsets any
          # persisted http.<url>.extraheader first and restores it afterwards,
          # so it never reads this one. The script below only runs
          # `git show <ref>:<path>`, a local object read needing no credential.
          # Left persisted, a `contents: write` token would instead sit
          # readable in .git/config for the whole job, which installs a
          # third-party npm tree and runs the Claude Code CLI over repository
          # content.
          persist-credentials: false

      - name: Guard - require Claude Code token
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN not set - skipping autotranslate. Generate one with 'claude setup-token' and add it as a repo secret, OR just run the bot locally where Claude Code is signed in: python3 scripts/i18n_autotranslate.py --locales-dir clawmetry/static/locales"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.SKIP != '1'
        with:
          python-version: '3.11'

      # The pinned CLI declares `engines: node >=22`, and this job previously
      # relied on whatever Node the runner image happened to ship. Pinning the
      # toolchain here keeps `npm ci` reproducible rather than image-dependent.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SKIP != '1'
        with:
          node-version: "22"

      # Installed from a committed lockfile rather than the registry's moving
      # `latest`. This job holds `contents: write`, `pull-requests: write` and
      # the CLAUDE_CODE_OAUTH_TOKEN secret, so what this step installs runs with
      # both — and `npm install -g @anthropic-ai/claude-code` took whatever the
      # tag pointed at the moment the job ran, which is the window a compromised
      # release is published into.
      #
      # `npm ci` installs exactly the tree recorded in
      # .github/claude-cli/package-lock.json and verifies every tarball against
      # the integrity hash stored beside it. A bare `@version` pin does neither:
      # it re-resolves transitive deps on each run and checks nothing. The npm
      # entry in .github/dependabot.yml is what keeps the lock from going stale.
      - name: Install Claude Code CLI (from lockfile)
        if: env.SKIP != '1'
        working-directory: .github/claude-cli
        run: |
          npm ci --no-audit --no-fund --silent
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Translate deltas (via Claude Code CLI, no API key)
        if: env.SKIP != '1'
        # The dispatch input is untrusted text. Bind it to an env var and read
        # it as a quoted shell variable — YAML quotes do NOT protect here,
        # because ${{ }} is substituted textually before bash parses the line.
        env:
          ONLY: ${{ github.event.inputs.only }}
          SINCE: ${{ github.event.before || 'HEAD~1' }}
        run: |
          python3 scripts/i18n_autotranslate.py \
            --engine claude-cli \
            --locales-dir clawmetry/static/locales \
            --since "$SINCE" \
            --only "$ONLY"

      - name: Open sync PR
        if: env.SKIP != '1'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/i18n-autotranslate
          delete-branch: true
          commit-message: 'chore(i18n): sync translations (autotranslate bot)'
          title: 'chore(i18n): sync translations'
          labels: i18n
          body: |
            Automated translation of new/changed English keys into all enabled locales.

            Generated by `scripts/i18n_autotranslate.py` (Claude). English `en.json`
            is the source of truth; only the delta was translated, orphans pruned,
            placeholder/markdown integrity enforced. Review and merge.

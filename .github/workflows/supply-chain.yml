name: Supply chain

# Everything a vendor security review asks about the code we ship, enforced on
# every PR so the answers stay true between reviews:
#
#   "Which third parties does the dashboard contact?"  -> none, gated below
#   "Is the vendored JS the real published release?"   -> byte-compared to npm
#   "Do you produce an SBOM?"                          -> yes, per run + release
#   "Any known-vulnerable dependencies?"               -> pip-audit + OSV
#
# These jobs are cheap (no matrix, no browser) and deliberately independent so
# one failure names one problem.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Advisories land continuously; a passing PR months ago says nothing about
    # today. Re-audit the shipped tree every Monday 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-external-assets:
    name: No third-party asset loads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Scan served pages for absolute http(s) asset references
        run: python3 scripts/verify_no_external_assets.py

  vendored-assets:
    name: Vendored assets match npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify sha256 pins and byte-compare against the npm registry
        run: python3 scripts/verify_vendor.py

  fonts-current:
    name: Vendored fonts not stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # requests is needed because tests/conftest.py imports it at module
      # scope, so pytest cannot collect without it. Flagged automatically by
      # tests/test_workflow_yaml_valid.py when this step first gained pytest.
      - run: python3 -m pip install --quiet certifi pytest requests
      # Proves the distinction the check depends on: an unreachable upstream is
      # reported as unverified, while a real difference still fails. Runs first
      # and needs no network, so a Google Fonts outage cannot stop it.
      - name: Font check degrades on an unreachable upstream (and only then)
        run: python3 -m pytest tests/test_vendor_fonts_degrades.py -q
      # Regenerates from the Google Fonts API and diffs against what is checked
      # in, so a hand-edited stylesheet or a half-finished regeneration fails.
      # An outage or an API-shape change is reported as SKIP rather than DRIFT:
      # the API is outside any contributor's control, so failing on it would
      # leave every PR red with nothing anyone could do about it.
      - name: Check checked-in font CSS matches a fresh generation
        run: python3 scripts/vendor_fonts.py --check

  python-deps:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python3 -m pip install --quiet pip-audit cyclonedx-bom
      - name: Audit declared dependencies for known advisories
        # Non-blocking on PRs: a fresh advisory in a transitive dep should not
        # wedge unrelated work. It still fails the scheduled run, which is the
        # signal that someone needs to act.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: pip-audit --requirement requirements.txt --strict --progress-spinner off
      - name: Generate CycloneDX SBOM
        run: |
          python3 -m pip install --quiet -r requirements.txt
          cyclonedx-py environment --output-format JSON > clawmetry-sbom.json
      - name: Publish SBOM as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clawmetry-sbom
          path: clawmetry-sbom.json
          retention-days: 90

  fuzz:
    name: Fuzz untrusted parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Atheris publishes Linux wheels up to CPython 3.11; 3.12+ would build
      # from source and need clang. Pinning 3.11 here keeps the job a wheel
      # install, independent of what the rest of the matrix moves to.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # requests is needed because tests/conftest.py imports it at module
      # scope, so pytest exits 4 (collection error) without it, before a
      # single test runs. Asserted by tests/test_workflow_yaml_valid.py.
      - run: python3 -m pip install --quiet atheris pytest requests

      # The seed corpus first: it is the set of inputs that have ALREADY broken
      # these contracts, it runs in under a second, and it fails loudly. If a
      # refactor reintroduces a known bug, this names it before the fuzzer
      # spends any time rediscovering it.
      - name: Known-bad corpus (regressions)
        run: python3 -m pytest tests/test_fuzz_targets.py -q

      # Bounded run counts, not a time budget, so the job cannot become the
      # slowest thing on the PR. The scheduled Monday run is where a long
      # search would belong if we ever want one.
      - name: Fuzz clawmetry.otlp_json (network-facing decoder)
        run: python3 tests/fuzz/fuzz_otlp_json.py -atheris_runs=50000 -artifact_prefix=fuzz-crash-

      - name: Fuzz clawmetry.event_shape (transcript classifier)
        run: python3 tests/fuzz/fuzz_event_shape.py -atheris_runs=50000 -artifact_prefix=fuzz-crash-

      # A crashing input is the whole product of a fuzz run. Without this the
      # bytes that triggered the failure exist only in a deleted runner.
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: fuzz-crash-*
          if-no-files-found: ignore
          retention-days: 30

  action-refs:
    name: Action references resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # An unresolvable action fails its job at "Set up job" before any step
      # runs, so the workflow looks like it ran and failed when it never
      # started. ossf/scorecard-action@v2 was exactly that, permanently, from
      # the day the job was written. This belongs in the supply-chain workflow
      # because an action reference IS a supply-chain dependency.
      - name: Resolve every `uses:` reference against the GitHub API
        env:
          CLAWMETRY_LIVE_CHECKS: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_action_refs.py

  actions-security:
    name: GitHub Actions security (zizmor)
    runs-on: ubuntu-latest
    # CI is part of the supply chain: a workflow step runs with this repo's
    # token and secrets, and its output is packaged into the wheel PyPI
    # serves. Both private repos in this family (clawmetry-cloud,
    # clawmetry-pro) have run zizmor on every PR for weeks; this repo, with
    # the most workflow definitions of the three and the only public attack
    # surface, was the one running no Actions-security scanner. Scorecard's
    # `Dangerous-Workflow` and `Token-Permissions` probes below cover part
    # of the same ground, but they run only on push (`if:` above) and score
    # the repository rather than naming the file and line.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python3 -m pip install --quiet zizmor

      - name: Audit every workflow definition
        env:
          # zizmor resolves action tags through the GitHub API. Unauthenticated,
          # those calls share the runner's IP rate limit and fail intermittently
          # — which, because a reachability failure aborts the WHOLE audit, is
          # the difference between a scan and no scan. Read-only; the job's
          # `contents: read` default is enough to read public action repos.
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit
          # Workflow definitions only, which is the scope the SecurityAuditScanner
          # component describes.
          #
          # The composite action under .github/actions/ is a real gap and is NOT
          # covered here: its steps run inline in the calling job, with that job's
          # token and secrets, so it carries the same rule families a workflow
          # does, and nothing scans it today. Widening this input set to include
          # it is a one-line change, but it is a scope the blueprint does not
          # describe, so it needs the product record first rather than arriving
          # as a side effect of turning the scanner on. Tracked as follow-up.
          inputs=".github/workflows"
          # Record the file set the scanner was handed. A finding list is
          # identical whether it audited thirty-seven files or none, so
          # coverage is the one thing the JSON cannot tell you afterwards.
          # shellcheck disable=SC2086
          find $inputs -type f \( -name '*.yml' -o -name '*.yaml' \) \
            | sort > audit/zizmor-inputs.txt
          n_inputs=$(wc -l < audit/zizmor-inputs.txt | tr -d '[:space:]')
          echo "$n_inputs" > audit/zizmor-input-count.txt
          echo "zizmor inputs ($n_inputs file(s)):"
          sed 's/^/  /' audit/zizmor-inputs.txt

          # `--no-exit-codes` makes FINDINGS exit 0, so a non-zero exit here
          # means only "the tool failed". Without it the two cases are
          # indistinguishable, and the usual `|| true` launders a crash — which
          # writes NO json — into an empty file that reads as a clean scan.
          rc=0
          # shellcheck disable=SC2086
          zizmor --no-exit-codes --format json --persona regular $inputs \
            > audit/zizmor.json 2> audit/zizmor.err || rc=$?
          # An empty input set would let zizmor exit 0 having audited nothing:
          # the same "clean scan" impostor as a crash.
          if [ "$n_inputs" -eq 0 ]; then
            echo "zizmor was handed no files to audit" >> audit/zizmor.err
            if [ "$rc" -eq 0 ]; then rc=1; fi
          fi
          # A crash leaves no json at all, so reject anything that does not
          # parse as a list.
          if ! python3 -c "import json; d = json.load(open('audit/zizmor.json')); assert isinstance(d, list); print(f'zizmor: {len(d)} finding(s)')" 2>/dev/null; then
            if [ "$rc" -eq 0 ]; then rc=1; fi
          fi
          if [ "$rc" -ne 0 ]; then
            # Recorded, not raised: the artifact still has to upload, and the
            # gate at the end of the job is what turns this red — once there
            # is something to diagnose it from.
            echo "$rc" > audit/zizmor.failed
            echo "::error::zizmor did not complete (exit $rc); this is a scanner outage, not a clean scan"
            sed 's/^/  /' audit/zizmor.err || true
          fi

      # Findings are reported, not gated. Today's tree has findings that are
      # load-bearing by design — the release, quarantine and cloud-pin jobs
      # persist their checkout credential BECAUSE they push with it — and a
      # gate that fails on those would be turned off within a week. The
      # summary is what makes a NEW finding visible in the PR that adds it.
      - name: Summarise findings
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, json, pathlib
          p = pathlib.Path("audit/zizmor.json")
          n = pathlib.Path("audit/zizmor-input-count.txt")
          print("### GitHub Actions security (zizmor)\n")
          if pathlib.Path("audit/zizmor.failed").exists() or not p.exists():
              print("**SCAN FAILED** — see the `actions-security-audit` artifact.")
              raise SystemExit(0)
          try:
              findings = json.loads(p.read_text())
          except Exception as exc:
              print(f"**SCAN FAILED** — unreadable report ({exc}).")
              raise SystemExit(0)
          covered = n.read_text().strip() if n.exists() else "?"
          print(f"{len(findings)} finding(s) across {covered} audited file(s).\n")
          if not findings:
              raise SystemExit(0)
          rank = {"High": 0, "Medium": 1, "Low": 2, "Informational": 3}
          counts = collections.Counter(
              (f.get("determinations", {}).get("severity") or "?") for f in findings
          )
          print("| Severity | Findings |")
          print("| --- | ---: |")
          for sev, c in sorted(counts.items(), key=lambda kv: rank.get(kv[0], 9)):
              print(f"| {sev} | {c} |")
          print()
          by_rule = collections.Counter(
              (
                  (f.get("determinations", {}).get("severity") or "?"),
                  (f.get("ident") or "?"),
              )
              for f in findings
          )
          print("| Severity | Rule | Findings |")
          print("| --- | --- | ---: |")
          for (sev, rule), c in sorted(
              by_rule.items(), key=lambda kv: (rank.get(kv[0][0], 9), kv[0][1])
          ):
              print(f"| {sev} | `{rule}` | {c} |")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: actions-security-audit
          path: audit/
          retention-days: 30

      # The only red condition: the scanner did not run. A silent outage is
      # the failure mode this whole job exists to avoid, because it looks
      # exactly like a clean result.
      - name: Fail if the scanner did not run
        if: always()
        run: |
          if [ -f audit/zizmor.failed ]; then
            echo "zizmor did not produce a usable report; treating as a failed scan."
            exit 1
          fi
          echo "zizmor completed."

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    # Scorecard reads repo settings/branch protection, and publishing results
    # needs id-token. Skipped on forks, which cannot mint the token.
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the v2.4.4 commit, not a floating tag. Two reasons:
      #
      # 1. `ossf/scorecard-action@v2` DOES NOT EXIST. The project publishes
      #    v2.4.4, v2.4.3, ... but no floating `v2`, so this job failed at
      #    "Set up job" with "Unable to resolve action" on every run since it
      #    was written. Nothing downstream ever executed.
      # 2. Scorecard grades repositories on whether they pin their own actions
      #    by digest, so a floating tag here would be this workflow failing the
      #    check it exists to run.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publishes to the public OpenSSF API so the README badge resolves.
          # Results are already public for a public repo.
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 30
      # Surfaces findings in the GitHub Security tab rather than only in logs.
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard-results.sarif

# Main-first runner priority.
#
# GitHub Actions has no queue priority on hosted runners: a push to main can sit
# behind hundreds of queued PR / dependabot jobs, which delays the release ->
# PyPI -> cloud pipeline (the one queue position that actually matters). This
# workflow implements the priority by hand:
#
#   1. clear-queue  — on every push to main, cancel all *queued* (never
#      in-progress) runs on non-main refs so main's jobs take the runners next.
#   2. requeue      — once main is quiet again (a main workflow or product-record
#      check completes), re-run the latest cancelled run
#      of each workflow for every open PR whose product-record check is
#      successful. PRs with failing product-record checks stay parked.
#
# No third-party actions on purpose: every step is `gh api` against
# GITHUB_TOKEN, so there is nothing to SHA-pin and no checkout needed.

name: Queue priority (main first)

on:
  push:
    branches: [main]
  # zizmor dangerous-triggers, analysed and accepted. The rule fires on any
  # `workflow_run`, because the trigger runs in the BASE repo with that repo's
  # secrets and scopes even when the run that woke it came from a fork PR —
  # dangerous precisely when the handler then checks out or executes something
  # from that upstream run. This workflow has no checkout at all: as the header
  # above records, every step is `gh api` against GITHUB_TOKEN, so there is no
  # attacker-controlled code path to reach. The only thing it reads from the
  # event is workflow metadata, to decide which of the two jobs runs.
  #
  # The `requeue` job only re-runs parked runs for same-repository open PRs; a
  # a re-run replays that run in its ORIGINAL pull_request context — the same
  # restricted token it had the first time. It cannot borrow this workflow's
  # scopes, which is why re-running is safe to automate here.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["*", "!Queue priority (main first)"]
    types: [completed]
  workflow_dispatch:

# Nothing at the workflow level: each job below declares exactly the scopes it
# spends. `actions: write` is the scope that cancels and re-runs other people's
# jobs, so it is granted per job rather than to every job in the file.
permissions: {}

# One instance at a time; a queued follow-up collapses into the latest.
concurrency:
  group: queue-priority
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}

jobs:
  clear-queue:
    name: Cancel queued non-main runs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Lists queued runs and cancels them. No checks or pull-request reads here.
    permissions:
      actions: write
    steps:
      - name: Cancel every queued run not on main
        run: |
          set -euo pipefail
          ok=0; fail=0
          ids=$(gh api "/repos/$REPO/actions/runs?status=queued&per_page=100" --paginate --slurp \
                        --jq '.[].workflow_runs[]
                              | select(.head_branch != "main")
                              # The PyPI publish fires on pull_request:closed, so its
                              # head branch is the merged PR branch, not main. Cancelling
                              # it left a [RELEASE] commit on main with nothing
                              # published (2026-09-03, #5464 vs #5455). Never park it.
                              | select(.name != "Auto-release on [RELEASE] merge")
                              | select(.name != "Product record (requirements before code)")
                              | select(.path != ".github/workflows/product-record-gate.yml")
                              | .id')
          for id in $ids; do
            if gh api -X POST "/repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1; then
              ok=$((ok+1))
            else
              # Already started / already finished / zombie run: not actionable.
              fail=$((fail+1))
            fi
          done
          echo "cancelled=$ok not-cancellable=$fail"

  requeue:
    name: Re-run reviewed-record PRs once main is idle
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.name == 'Product record (requirements before code)'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Requeue cancelled PR validation after the portable record check succeeds.
    # Merge safety is still enforced by the required E2E aggregate.
    permissions:
      actions: write
      checks: read
      pull-requests: read
    steps:
      - name: Skip while main still has queued or running jobs
        id: gate
        # SELF is read by jq through `env`, not expanded into the filter. A
        # `${{ }}` expression is substituted as text before jq (or bash) parses
        # the line, so a workflow name containing a quote or a backslash would
        # otherwise land in the filter as jq source rather than as a string.
        env:
          SELF: ${{ github.workflow }}
        run: |
          set -euo pipefail
          busy=$(gh api "/repos/$REPO/actions/runs?branch=main&per_page=100" --paginate --slurp \
                   --jq '[.[].workflow_runs[]
                          | select(.status == "queued" or .status == "in_progress")
                          | select(.name != env.SELF)] | length')
          echo "main busy runs: $busy"
          echo "idle=$([ "$busy" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Re-run cancelled runs for open PRs with a valid product record
        if: steps.gate.outputs.idle == 'true'
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          export CUTOFF
          pulls=$(gh api "/repos/$REPO/pulls?state=open&per_page=100" --paginate --slurp \
            --jq '.[][] | select(.head.repo.full_name == env.REPO) | "\(.number)\t\(.head.ref)\t\(.head.sha)"')
          rerun_failures=0
          while IFS=$'\t' read -r pr branch sha; do
            [ -n "$pr" ] || continue
            # Requeue only after the portable product-record check has passed.
            # This schedules work; the required E2E aggregate still gates merging.
            record=$(gh api "/repos/$REPO/commits/$sha/check-runs?per_page=100" --paginate --slurp \
                       --jq '[.[].check_runs[] | select(.name == "PR cites the product record that justified it")]
                             | max_by(.id) | .conclusion // "unreported"')
            [ "$record" = "success" ] || { echo "PR #$pr: product-record=$record, parked"; continue; }
            # Latest run per workflow on this exact head; re-run it only if it
            # ended cancelled (i.e. we parked it) and recently.
            export CANDIDATE_SHA="$sha"
            branch_query=$(jq -nr --arg ref "$branch" '$ref | @uri')
            ids=$(gh api "/repos/$REPO/actions/runs?branch=$branch_query&event=pull_request&per_page=100" --paginate --slurp \
              --jq '[.[].workflow_runs[] | select(.head_sha == env.CANDIDATE_SHA and .created_at > env.CUTOFF)]
                   | group_by(.workflow_id) | .[] | max_by(.created_at)
                   | select(.conclusion == "cancelled") | .id')
            while read -r id; do
              [ -n "$id" ] || continue
              if gh api -X POST "/repos/$REPO/actions/runs/$id/rerun" >/dev/null 2>&1; then
                echo "PR #$pr: re-ran $id"
              else
                echo "PR #$pr: could not re-run $id"
                rerun_failures=$((rerun_failures+1))
              fi
            done <<< "$ids"
          done <<< "$pulls"
          [ "$rerun_failures" -eq 0 ]

name: Build desktop artifacts (.dmg / .exe / .AppImage)

# Produces clickable, unsigned downloads for the ClawMetry menubar/tray
# app on macOS, Windows, and Linux. Runs on:
#   - manual dispatch (any branch — use to smoke test locally-built specs)
#   - version tag push (v*.*.*) — attaches artifacts to the GitHub Release
# Signing is wired for macOS (Developer ID + notarization) AND Windows
# (Authenticode via signtool; installer + embedded uninstaller stub +
# ClawMetry.exe). Each activates only when its repo secrets are set and
# NO-OPs otherwise, so forks build unsigned artifacts. Unsigned Windows
# builds don't just SmartScreen-warn: Smart App Control in enforce mode
# blocks the unsigned NSIS uninstaller's %TEMP% relaunch, making the app
# un-uninstallable from Settings > Apps (lab repro 2026-08-10).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  macos:
    name: macOS .app + .dmg (signed + notarized when secrets are set)
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_SIGN: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require signing on release tags
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGN != 'true'
        shell: bash
        run: |
          echo "::error::${GITHUB_REF_NAME} would ship an UNSIGNED macOS build. Set MACOS_SIGN_IDENTITY + MACOS_CERT_P12_BASE64."
          exit 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          pip install --upgrade pip wheel
          pip install -r desktop/requirements-dev.txt

      - name: Stamp bundle version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('dashboard.py').read()).group(1))")
          fi
          echo "$VERSION" > desktop/assets/version.txt
          echo "stamped $VERSION"

      - name: Build .app
        run: pyinstaller --clean --noconfirm desktop/build_mac.spec

      - name: Smoke test the built .app
        run: python3 desktop/smoke_test.py dist/ClawMetry.app

      - name: Import Developer ID cert into a build keychain
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          PASS="build-${GITHUB_RUN_ID}"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASS" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning -v "$KEYCHAIN"

      - name: Sign + notarize + staple .app
        if: env.HAS_SIGN == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: desktop/sign_mac.sh dist/ClawMetry.app

      - name: Wrap into .dmg (drag-to-Applications layout)
        run: |
          if [ -n "${GITHUB_REF_NAME:-}" ] && [[ "$GITHUB_REF_NAME" == v*.*.* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('dashboard.py').read()).group(1))")
          fi
          STAGING="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R dist/ClawMetry.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          TEMP_DMG="$RUNNER_TEMP/ClawMetry-temp.dmg"
          hdiutil create -volname "ClawMetry" \
            -srcfolder "$STAGING" \
            -ov -format UDRW -fs HFS+ \
            "$TEMP_DMG"
          hdiutil attach "$TEMP_DMG" -readwrite -noverify -mountpoint /Volumes/ClawMetry
          osascript <<'AS'
          tell application "Finder"
            tell disk "ClawMetry"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set bounds of container window to {200, 200, 800, 500}
              set theViewOptions to icon view options of container window
              set arrangement of theViewOptions to not arranged
              set icon size of theViewOptions to 96
              set text size of theViewOptions to 13
              set position of item "ClawMetry.app" of container window to {155, 130}
              set position of item "Applications" of container window to {445, 130}
              close
              open
              update without registering applications
              delay 2
            end tell
          end tell
          AS
          sync && sleep 2
          osascript -e 'tell application "Finder" to close every window' || true
          sleep 1
          detached=""
          for i in 1 2 3 4 5 6; do
            if hdiutil detach "/Volumes/ClawMetry" -force; then
              detached=1; break
            fi
            echo "detach attempt $i failed; retrying in $((i * 3))s"
            sleep $((i * 3))
          done
          if [ -z "$detached" ]; then
            diskutil unmountDisk force "/Volumes/ClawMetry" || true
            sleep 3
            hdiutil detach "/Volumes/ClawMetry" -force || true
          fi
          if mount | grep -q "/Volumes/ClawMetry"; then
            echo "::error::could not detach /Volumes/ClawMetry after retries"
            exit 1
          fi
          hdiutil convert "$TEMP_DMG" \
            -format UDZO -imagekey zlib-level=9 \
            -o "dist/ClawMetry-${VERSION}.dmg"
          rm -f "$TEMP_DMG"
          cp "dist/ClawMetry-${VERSION}.dmg" "dist/ClawMetry-mac.dmg"

      - name: Sign + notarize + staple the .dmg itself
        if: env.HAS_SIGN == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for dmg in dist/*.dmg; do
            desktop/sign_mac.sh "$dmg"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clawmetry-macos
          path: dist/*.dmg

  windows:
    name: Windows .exe (signed when secrets are set)
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    environment: release
    env:
      HAS_AZ_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZ_SIGN_PROFILE != '' }}
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' && !(secrets.AZURE_CLIENT_ID != '' && secrets.AZ_SIGN_PROFILE != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require signing on release tags
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_AZ_SIGN != 'true' && env.HAS_WIN_CERT != 'true'
        shell: bash
        run: |
          echo "::error::${GITHUB_REF_NAME} would ship an UNSIGNED Windows build. Set AZURE_CLIENT_ID + AZ_SIGN_PROFILE (Artifact Signing) or WINDOWS_CERT_PFX_BASE64."
          exit 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r desktop/requirements-dev.txt

      - name: Stamp bundle version
        shell: pwsh
        run: |
          $refName = $Env:GITHUB_REF_NAME
          if ($Env:GITHUB_REF_TYPE -eq "tag") {
            $version = $refName.Substring(1)
          } else {
            $version = (Select-String -Path dashboard.py -Pattern '__version__ = "(.+?)"').Matches.Groups[1].Value
          }
          [IO.File]::WriteAllText("desktop/assets/version.txt", $version, [Text.Encoding]::ASCII)
          Write-Host "stamped $version"

      - name: Build tray .exe
        run: pyinstaller --clean --noconfirm desktop/build_windows.spec

      - name: Smoke test the built .exe
        run: python desktop/smoke_test.py dist\ClawMetry\ClawMetry.exe

      - name: Azure login (OIDC)
        if: env.HAS_AZ_SIGN == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Artifact Signing dlib + wrapper
        if: env.HAS_AZ_SIGN == 'true'
        shell: pwsh
        env:
          AZ_SIGN_ENDPOINT: ${{ secrets.AZ_SIGN_ENDPOINT }}
          AZ_SIGN_ACCOUNT: ${{ secrets.AZ_SIGN_ACCOUNT }}
          AZ_SIGN_PROFILE: ${{ secrets.AZ_SIGN_PROFILE }}
        run: |
          nuget install Microsoft.ArtifactSigning.Client -Version 1.0.128 `
            -OutputDirectory $Env:RUNNER_TEMP\ts -ExcludeVersion -NonInteractive
          nuget install Microsoft.Windows.SDK.BuildTools `
            -OutputDirectory $Env:RUNNER_TEMP\ts -ExcludeVersion -NonInteractive
          $dlib = "$Env:RUNNER_TEMP\ts\Microsoft.ArtifactSigning.Client\bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { throw "Artifact Signing dlib not found at $dlib" }
          $signtool = Get-ChildItem "$Env:RUNNER_TEMP\ts\Microsoft.Windows.SDK.BuildTools\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found in SDK BuildTools package" }
          $meta = Join-Path $Env:RUNNER_TEMP "signing-metadata.json"
          @{
            Endpoint               = $Env:AZ_SIGN_ENDPOINT
            CodeSigningAccountName = $Env:AZ_SIGN_ACCOUNT
            CertificateProfileName = $Env:AZ_SIGN_PROFILE
          } | ConvertTo-Json | Set-Content -Path $meta -Encoding ascii
          $cmd = Join-Path $Env:RUNNER_TEMP "sign.cmd"
          @(
            '@echo off'
            "`"$signtool`" sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `"$dlib`" /dmdf `"$meta`" %1"
          ) | Set-Content -Path $cmd -Encoding ascii
          "SIGN_CMD=$cmd" >> $Env:GITHUB_ENV
          "SIGNTOOL=$signtool" >> $Env:GITHUB_ENV
          "SIGN_ENABLED=true" >> $Env:GITHUB_ENV

      - name: Prepare signing cert + wrapper
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $Env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($Env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found in Windows SDK" }
          $cmd = Join-Path $Env:RUNNER_TEMP "sign.cmd"
          @(
            '@echo off'
            "`"$signtool`" sign /f `"$pfx`" /p %CLAWMETRY_SIGN_PW% /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 %1"
          ) | Set-Content -Path $cmd -Encoding ascii
          "SIGN_CMD=$cmd" >> $Env:GITHUB_ENV
          "SIGNTOOL=$signtool" >> $Env:GITHUB_ENV
          "SIGN_ENABLED=true" >> $Env:GITHUB_ENV

      - name: Sign ClawMetry.exe
        if: env.SIGN_ENABLED == 'true'
        shell: pwsh
        env:
          CLAWMETRY_SIGN_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $Env:SIGN_CMD "dist\ClawMetry\ClawMetry.exe"
          if ($LASTEXITCODE -ne 0) { throw "signing ClawMetry.exe failed ($LASTEXITCODE)" }

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $refName = $Env:GITHUB_REF_NAME
          if ($refName -and $refName -match '^v\d+\.\d+\.\d+$') {
            $version = $refName.Substring(1)
          } else {
            $version = (Select-String -Path dashboard.py -Pattern '__version__ = "(.+?)"').Matches.Groups[1].Value
          }
          "version=$version" >> $Env:GITHUB_OUTPUT

      - name: Zip distribution folder
        working-directory: dist
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path ClawMetry -DestinationPath "ClawMetry-$version-windows.zip"
          Copy-Item "ClawMetry-$version-windows.zip" "ClawMetry-windows.zip" -Force

      - name: Build NSIS installer
        shell: pwsh
        env:
          CLAWMETRY_SIGN_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $makensis = (where.exe makensis 2>$null | Select-Object -First 1)
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          $nsisArgs = @("/DVERSION=${{ steps.ver.outputs.version }}")
          if ("${{ steps.ver.outputs.version }}" -match '^\d+\.\d+\.\d+$') { $nsisArgs += "/DVIVERSION=${{ steps.ver.outputs.version }}.0" }
          if ($Env:SIGN_ENABLED -eq 'true') { $nsisArgs += "/DSIGN_CMD=$Env:SIGN_CMD" }
          $nsisArgs += @("/DSRC_DIR=$PWD\dist\ClawMetry", "desktop\installer\windows.nsi")
          & $makensis @nsisArgs
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          Move-Item "desktop\installer\ClawMetry-Setup-${{ steps.ver.outputs.version }}.exe" "dist\ClawMetry-Setup-${{ steps.ver.outputs.version }}.exe"
          Copy-Item "dist\ClawMetry-Setup-${{ steps.ver.outputs.version }}.exe" "dist\ClawMetry-windows-setup.exe" -Force

      - name: Verify signatures + scrub cert
        if: env.SIGN_ENABLED == 'true'
        shell: pwsh
        run: |
          foreach ($t in @("dist\ClawMetry-windows-setup.exe", "dist\ClawMetry\ClawMetry.exe")) {
            & $Env:SIGNTOOL verify /pa $t
            if ($LASTEXITCODE -ne 0) { throw "$t is not validly signed" }
            $sig = Get-AuthenticodeSignature $t
            if (-not $sig.TimeStamperCertificate) {
              throw "$t has no RFC 3161 countersignature; it would go invalid when the three-day certificate expires"
            }
            Write-Host "OK  $t"
            Write-Host "    signer:    $($sig.SignerCertificate.Subject)"
            Write-Host "    timestamp: $($sig.TimeStamperCertificate.Subject)"
          }
          $pfx = Join-Path $Env:RUNNER_TEMP "codesign.pfx"
          if (Test-Path $pfx) { Remove-Item $pfx -Force }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clawmetry-windows
          path: |
            dist/*.zip
            dist/*.exe

  linux:
    name: Linux single-folder + AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 \
            libayatana-appindicator3-1 libnotify4 \
            libgirepository1.0-dev libgirepository-2.0-dev \
            libcairo2-dev pkg-config xvfb

      - name: Install build deps
        run: |
          pip install --upgrade pip wheel
          pip install --ignore-installed -r desktop/requirements-dev.txt

      - name: Stamp bundle version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('dashboard.py').read()).group(1))")
          fi
          echo "$VERSION" > desktop/assets/version.txt
          echo "stamped $VERSION"

      - name: Build tray binary
        run: pyinstaller --clean --noconfirm desktop/build_linux.spec

      - name: Smoke test the built binary
        run: python3 desktop/smoke_test.py dist/clawmetry/clawmetry

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${GITHUB_REF_NAME:-}" ] && [[ "$GITHUB_REF_NAME" == v*.*.* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('dashboard.py').read()).group(1))")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tarball distribution folder
        working-directory: dist
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          tar czf "clawmetry-${VERSION}-linux-x86_64.tar.gz" clawmetry
          cp "clawmetry-${VERSION}-linux-x86_64.tar.gz" "clawmetry-linux.tar.gz"

      - name: Build AppImage
        working-directory: dist
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          APPDIR="ClawMetry.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r clawmetry/. "$APPDIR/usr/bin/"
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/clawmetry" "$@"' \
            > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp ../desktop/assets/clawmetry-512.png "$APPDIR/clawmetry.png"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=ClawMetry' \
            'Exec=AppRun' \
            'Icon=clawmetry' \
            'Categories=Development;Monitor;' \
            'Terminal=false' \
            > "$APPDIR/clawmetry.desktop"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "ClawMetry-${VERSION}-x86_64.AppImage"
          cp "ClawMetry-${VERSION}-x86_64.AppImage" "clawmetry-linux.AppImage"
          rm -rf "$APPDIR" appimagetool

      - name: Smoke test the AppImage
        run: python3 desktop/smoke_test.py dist/clawmetry-linux.AppImage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clawmetry-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage

  release:
    name: Attach artifacts to Release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Attach to release and publish
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          make_latest: "true"
          files: |
            artifacts/clawmetry-macos/*.dmg
            artifacts/clawmetry-windows/*.zip
            artifacts/clawmetry-windows/*.exe
            artifacts/clawmetry-linux/*.tar.gz
            artifacts/clawmetry-linux/*.AppImage
          fail_on_unmatched_files: true

name: Build desktop artifacts (.dmg / .exe / .AppImage)

# Produces clickable, unsigned downloads for the ClawMetry menubar/tray
# app on macOS, Windows, and Linux. Runs on:
#   - manual dispatch (any branch — use to smoke test locally-built specs)
#   - version tag push (v*.*.*) — attaches artifacts to the GitHub Release
# Signing is wired for macOS (Developer ID + notarization) AND Windows
# (Authenticode via signtool; installer + embedded uninstaller stub +
# ClawMetry.exe). Each activates only when its repo secrets are set and
# NO-OPs otherwise, so forks build unsigned artifacts. Unsigned Windows
# builds don't just SmartScreen-warn: Smart App Control in enforce mode
# blocks the unsigned NSIS uninstaller's %TEMP% relaunch, making the app
# un-uninstallable from Settings > Apps (lab repro 2026-08-10).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  macos:
    name: macOS .app + .dmg (signed + notarized when secrets are set)
    runs-on: macos-latest
    # The `secrets` context is not available in step-level `if:` conditionals
    # (the workflow parser rejects it — GitHub restricts `secrets` to `env:`,
    # `with:`, and `run:`). Hoist the presence checks into job-level `env` so
    # steps can gate on `env.HAS_*`, which IS legal in `if:`. The values are
    # 'true' / 'false' strings because that is what `!= ''` evaluates to.
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_SIGN: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          pip install --upgrade pip wheel
          # Thin shell: no clawmetry install needed here. Bundle only
          # ships pywebview + PIL. Runtime pip-installs clawmetry on
          # user's machine on first launch.
          pip install -r desktop/requirements-dev.txt

      # PyInstaller (not py2app). py2app 0.28.x has a broken macOS
      # version check on Tahoe / macOS 26 and refuses to build; the
      # setup_py2app.py spec is kept in-tree for the day py2app
      # catches up but is not on the shipping path.
      - name: Build .app
        run: pyinstaller --clean --noconfirm desktop/build_mac.spec

      # --- Code-signing + notarization ---
      # These steps NO-OP when the secrets aren't configured, so PRs
      # from forks and unsigned dev builds still succeed. Add these
      # repo secrets in Settings → Secrets and variables → Actions:
      #   MACOS_CERT_P12_BASE64         Developer ID Application .p12 (base64)
      #   MACOS_CERT_P12_PASSWORD       password used when exporting the .p12
      #   MACOS_SIGN_IDENTITY           e.g. "Developer ID Application: InstaLabs LLC (8LVH596RA5)"
      #   APPLE_ID                      Apple ID email
      #   APPLE_TEAM_ID                 e.g. 8LVH596RA5
      #   APPLE_APP_SPECIFIC_PASSWORD   from https://appleid.apple.com → App-Specific Passwords
      - name: Import Developer ID cert into a build keychain
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          PASS="build-${GITHUB_RUN_ID}"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASS" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Show what we imported (identities only — no keys)
          security find-identity -p codesigning -v "$KEYCHAIN"

      - name: Sign + notarize + staple .app
        if: env.HAS_SIGN == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: desktop/sign_mac.sh dist/ClawMetry.app

      - name: Wrap into .dmg (drag-to-Applications layout)
        run: |
          # Prefer the tag ref (v0.12.<n> → 0.12.<n>) over dashboard.py's
          # __version__ because release-on-merge commits the version bump
          # in a SEPARATE follow-up PR, so at the tag ref dashboard.py is
          # still stale by one release. Falls back to dashboard.py for
          # non-tag runs (manual dispatch on main, PR CI).
          if [ -n "${GITHUB_REF_NAME:-}" ] && [[ "$GITHUB_REF_NAME" == v*.*.* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('dashboard.py').read()).group(1))")
          fi

          # Stage the .dmg contents so the mounted volume has BOTH the
          # .app and a symlink to /Applications, giving users the standard
          # macOS drag-to-install UX. Without this the DMG mounts to an
          # otherwise-empty window with just ClawMetry.app, and users have
          # to figure out on their own that they should drag it somewhere.
          # Pattern mirrored from clawmetry-mac/.github/workflows/build-sign-release.yml.
          STAGING="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R dist/ClawMetry.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          # Build a writable DMG first so we can osascript the Finder into
          # arranging the icons + hiding the toolbar, then convert to the
          # final compressed read-only UDZO the release ships.
          TEMP_DMG="$RUNNER_TEMP/ClawMetry-temp.dmg"
          hdiutil create -volname "ClawMetry" \
            -srcfolder "$STAGING" \
            -ov -format UDRW -fs HFS+ \
            "$TEMP_DMG"
          hdiutil attach "$TEMP_DMG" -readwrite -noverify -mountpoint /Volumes/ClawMetry

          osascript <<'AS'
          tell application "Finder"
            tell disk "ClawMetry"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set bounds of container window to {200, 200, 800, 500}
              set theViewOptions to icon view options of container window
              set arrangement of theViewOptions to not arranged
              set icon size of theViewOptions to 96
              set text size of theViewOptions to 13
              set position of item "ClawMetry.app" of container window to {155, 130}
              set position of item "Applications" of container window to {445, 130}
              close
              open
              update without registering applications
              delay 2
            end tell
          end tell
          AS

          sync && sleep 2
          osascript -e 'tell application "Finder" to close every window' || true
          sleep 1
          hdiutil detach "/Volumes/ClawMetry" -force

          # Convert writable UDRW → compressed read-only UDZO (final shape).
          hdiutil convert "$TEMP_DMG" \
            -format UDZO -imagekey zlib-level=9 \
            -o "dist/ClawMetry-${VERSION}.dmg"
          rm -f "$TEMP_DMG"

          # Fixed-name copy so clawmetry.com/download/mac can link a stable
          # URL (GitHub's /releases/latest/download/<name>) instead of
          # bookkeeping the current version anywhere else. Placed BEFORE
          # the sign step below so it rides the same `dist/*.dmg` signing
          # loop as the versioned file.
          cp "dist/ClawMetry-${VERSION}.dmg" "dist/ClawMetry-mac.dmg"

      - name: Sign + notarize + staple the .dmg itself
        if: env.HAS_SIGN == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for dmg in dist/*.dmg; do
            desktop/sign_mac.sh "$dmg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: clawmetry-macos
          path: dist/*.dmg

  windows:
    name: Windows .exe (signed when secrets are set)
    runs-on: windows-latest
    # Same secrets-presence hoisting trick as the macOS job above. Signing
    # activates when these repo secrets exist (OV/EV PFX export):
    #   WINDOWS_CERT_PFX_BASE64   code-signing cert + key as base64 .pfx
    #   WINDOWS_CERT_PASSWORD     password protecting the .pfx
    # Without them every step NO-OPs, so forks and dev builds stay green
    # and simply produce unsigned artifacts (SmartScreen warns; Smart App
    # Control blocks the uninstaller - see the .nsi comment).
    env:
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r desktop/requirements-dev.txt

      - name: Build tray .exe
        run: pyinstaller --clean --noconfirm desktop/build_windows.spec

      # --- Authenticode signing setup ---
      # Decodes the cert and writes a sign.cmd wrapper that both this
      # workflow AND makensis (via /DSIGN_CMD + !finalize/!uninstfinalize
      # in windows.nsi) invoke. The wrapper reads the password from the
      # environment at run time so it never appears in a command line or
      # on disk. SHA-256 digest + RFC 3161 timestamp so signatures outlive
      # the cert's expiry.
      - name: Prepare signing cert + wrapper
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $Env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($Env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found in Windows SDK" }
          $cmd = Join-Path $Env:RUNNER_TEMP "sign.cmd"
          @(
            '@echo off'
            "`"$signtool`" sign /f `"$pfx`" /p %CLAWMETRY_SIGN_PW% /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 %1"
          ) | Set-Content -Path $cmd -Encoding ascii
          "SIGN_CMD=$cmd" >> $Env:GITHUB_ENV

      # Sign the app exe BEFORE the zip + installer steps so both the
      # portable .zip and the NSIS-packed install tree ship a signed
      # ClawMetry.exe (Smart App Control evaluates it at launch too).
      - name: Sign ClawMetry.exe
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          CLAWMETRY_SIGN_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $Env:SIGN_CMD "dist\ClawMetry\ClawMetry.exe"
          if ($LASTEXITCODE -ne 0) { throw "signing ClawMetry.exe failed ($LASTEXITCODE)" }

      - name: Resolve version
        id: ver
        shell: pwsh
        # Tag-first version selection, same as the macOS job — see comment
        # there. Falls back to dashboard.py __version__ for non-tag runs.
        # Shared across the zip + installer steps below so it's computed once.
        run: |
          $refName = $Env:GITHUB_REF_NAME
          if ($refName -and $refName -match '^v\d+\.\d+\.\d+$') {
            $version = $refName.Substring(1)
          } else {
            $version = (Select-String -Path dashboard.py -Pattern '__version__ = "(.+?)"').Matches.Groups[1].Value
          }
          "version=$version" >> $Env:GITHUB_OUTPUT

      - name: Zip distribution folder
        working-directory: dist
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path ClawMetry -DestinationPath "ClawMetry-$version-windows.zip"
          # Fixed-name copy so clawmetry.com/download/windows-zip can link a
          # stable URL (GitHub's /releases/latest/download/<name>) instead
          # of bookkeeping the current version anywhere else.
          Copy-Item "ClawMetry-$version-windows.zip" "ClawMetry-windows.zip" -Force

      # Real installer (FLYWHEEL.md §0b): Start Menu + Desktop shortcuts,
      # an uninstaller registered in Add/Remove Programs, per-user install
      # (no UAC prompt). NSIS ships preinstalled on the windows-latest
      # runner image; the `where.exe` probe + choco fallback keeps this
      # working if that ever changes upstream.
      - name: Build NSIS installer
        shell: pwsh
        # When the cert secrets are set, /DSIGN_CMD turns on the
        # !finalize/!uninstfinalize hooks in windows.nsi: makensis signs the
        # embedded uninstaller stub (the only place a WriteUninstaller-
        # regenerated Uninstall.exe can ever get a signature - see the .nsi
        # comment on Smart App Control) and the setup exe itself. The
        # wrapper reads CLAWMETRY_SIGN_PW from this step's environment.
        env:
          CLAWMETRY_SIGN_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $makensis = (where.exe makensis 2>$null | Select-Object -First 1)
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          $signArgs = @()
          if ($Env:HAS_WIN_CERT -eq 'true') { $signArgs = @("/DSIGN_CMD=$Env:SIGN_CMD") }
          & $makensis @signArgs "/DVERSION=${{ steps.ver.outputs.version }}" "/DSRC_DIR=$PWD\dist\ClawMetry" desktop\installer\windows.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          Move-Item "desktop\installer\ClawMetry-Setup-${{ steps.ver.outputs.version }}.exe" "dist\ClawMetry-Setup-${{ steps.ver.outputs.version }}.exe"
          # Fixed-name copy — same stable-URL convention as the zip above.
          Copy-Item "dist\ClawMetry-Setup-${{ steps.ver.outputs.version }}.exe" "dist\ClawMetry-windows-setup.exe" -Force

      # Verify the artifact, not the build log (FLYWHEEL §0b.5): a chained
      # Authenticode signature must actually be on the setup exe and the
      # app exe, or the SAC uninstall fix silently didn't ship. Also
      # removes the decoded cert so it never lands in an artifact.
      - name: Verify signatures + scrub cert
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool verify /pa "dist\ClawMetry-windows-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "setup exe is not validly signed" }
          & $signtool verify /pa "dist\ClawMetry\ClawMetry.exe"
          if ($LASTEXITCODE -ne 0) { throw "ClawMetry.exe is not validly signed" }
          Remove-Item (Join-Path $Env:RUNNER_TEMP "codesign.pfx") -Force

      - uses: actions/upload-artifact@v4
        with:
          name: clawmetry-windows
          path: |
            dist/*.zip
            dist/*.exe

  linux:
    name: Linux single-folder + AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          # GTK WebKit2 is the pywebview backend on Linux. The
          # libgirepository-2.0-dev / libcairo2-dev / pkg-config trio is
          # needed to compile PyGObject (see requirements-dev.txt) against
          # THIS job's actions/setup-python interpreter — without a
          # matching build, the frozen binary can't import `gi` at all
          # and crashes before ever opening a window.
          #
          # PyGObject 3.52+ (we pin 3.56.3) requires girepository-2.0 —
          # 3.50.x was the last release on girepository-1.0. This job was
          # installing ONLY libgirepository1.0-dev, so every meson build
          # failed at `Dependency 'girepository-2.0' is required but not
          # found`, the whole Linux job errored out, the strict attach
          # step (fail_on_unmatched_files: true) skipped publishing, every
          # release since 2026-08-10 stayed a draft, and
          # ``releases/latest`` kept serving the 2026-08-10 build. Users
          # downloading from clawmetry.com never got any fix shipped
          # after that date — including the SSL cert verify fix (#4752)
          # that the "Send code" button depends on. Install both -1.0
          # (still needed for webkit2gtk-4.1 headers on older subdeps)
          # and -2.0 (what PyGObject 3.52+ compiles against). ubuntu-24.04
          # (current ubuntu-latest) has both in the default archive.
          sudo apt-get install -y \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 \
            libayatana-appindicator3-1 libnotify4 \
            libgirepository1.0-dev libgirepository-2.0-dev \
            libcairo2-dev pkg-config

      - name: Install build deps
        run: |
          pip install --upgrade pip wheel
          # --ignore-installed: if the runner image ever ships an apt
          # python3-gi, pip's "already satisfied" check would otherwise
          # skip building the pinned PyGObject wheel THIS interpreter
          # actually needs (see requirements-dev.txt), and re-introduce
          # the "cannot import _gi" crash the pin exists to avoid.
          pip install --ignore-installed -r desktop/requirements-dev.txt

      - name: Build tray binary
        run: pyinstaller --clean --noconfirm desktop/build_linux.spec

      - name: Resolve version
        id: ver
        # Same tag-first version selection as the macOS job — see comment
        # there. Falls back to dashboard.py __version__ for non-tag runs.
        # Shared across the tarball + AppImage steps below.
        run: |
          if [ -n "${GITHUB_REF_NAME:-}" ] && [[ "$GITHUB_REF_NAME" == v*.*.* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('dashboard.py').read()).group(1))")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tarball distribution folder
        working-directory: dist
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          tar czf "clawmetry-${VERSION}-linux-x86_64.tar.gz" clawmetry
          # Fixed-name copy so clawmetry.com/download/linux-tarball can link
          # a stable URL (GitHub's /releases/latest/download/<name>) instead
          # of bookkeeping the current version anywhere else.
          cp "clawmetry-${VERSION}-linux-x86_64.tar.gz" "clawmetry-linux.tar.gz"

      # Real installer (FLYWHEEL.md §0b): this job was literally named
      # "Linux single-folder + AppImage" from day one but only ever shipped
      # the tarball above — the AppImage step was never written. AppImage is
      # the universal pick across "all flavours Linux": no root, no distro
      # package manager, works on Ubuntu/Fedora/Arch/etc via FUSE (or
      # --appimage-extract-and-run where FUSE is unavailable, e.g. some
      # containers).
      - name: Build AppImage
        working-directory: dist
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          APPDIR="ClawMetry.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r clawmetry/. "$APPDIR/usr/bin/"
          # AppRun is the entry point appimagetool/the runtime execs. Written
          # with printf (not a heredoc) since this whole step is one indented
          # YAML block scalar — a heredoc terminator needs to sit at column
          # zero, which YAML's indentation would break.
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/clawmetry" "$@"' \
            > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp ../desktop/assets/clawmetry-512.png "$APPDIR/clawmetry.png"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=ClawMetry' \
            'Exec=AppRun' \
            'Icon=clawmetry' \
            'Categories=Development;Monitor;' \
            'Terminal=false' \
            > "$APPDIR/clawmetry.desktop"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # appimagetool itself needs FUSE to run as an AppImage on the
          # runner; --appimage-extract-and-run sidesteps that dependency.
          ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "ClawMetry-${VERSION}-x86_64.AppImage"
          # Fixed-name copy — same stable-URL convention as the tarball above.
          cp "ClawMetry-${VERSION}-x86_64.AppImage" "clawmetry-linux.AppImage"
          rm -rf "$APPDIR" appimagetool

      - uses: actions/upload-artifact@v4
        with:
          name: clawmetry-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage

  release:
    name: Attach artifacts to Release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # softprops/action-gh-release needs write access to the Contents API
    # to attach files to the existing tag's Release. Default GITHUB_TOKEN
    # scope is read-only when the org sets that as the default; declare
    # explicitly so the step never silently 403s.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      # release-on-merge.yml creates the Release as a DRAFT so GitHub's
      # /releases/latest (which every clawmetry.com download button
      # resolves through) keeps pointing at the previous COMPLETE release
      # while these installers build. This step attaches all assets and
      # then publishes in one go (draft: false + make_latest).
      # fail_on_unmatched_files is deliberately true: a missing installer
      # must keep the release draft rather than publish a "latest" whose
      # download links 404 (seen live on v0.12.674, 2026-08-10).
      - name: Attach to release and publish
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: "true"
          files: |
            artifacts/clawmetry-macos/*.dmg
            artifacts/clawmetry-windows/*.zip
            artifacts/clawmetry-windows/*.exe
            artifacts/clawmetry-linux/*.tar.gz
            artifacts/clawmetry-linux/*.AppImage
          fail_on_unmatched_files: true

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on v0.10.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.10.0)'
        required: true

# Least-privilege default. The publish job below declares its own
# permissions block (contents: read + id-token: write + attestations:
# write), which replaces this default wholesale -- provenance minting and
# PyPI Trusted Publishing are unaffected.
permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Mints the short-lived OIDC token used for build provenance and, once
      # enabled, PyPI Trusted Publishing. Both are no-ops without it.
      id-token: write
      # Records the provenance attestation against the repo.
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          # This job builds the frontend bundle that is packaged into the
          # wheel and uploaded to PyPI, so anything restored into the
          # workspace before `python3 -m build` ends up inside a published,
          # provenanced artifact. A GitHub Actions cache is not trusted
          # input: an entry seeded from a less-trusted context on this repo
          # can be restored by a later release run. zizmor reports the
          # combination as `cache-poisoning` (High).
          #
          # setup-node's `package-manager-cache` defaults to true, but only
          # actually caches when package.json declares `devEngines
          # .packageManager` or a top-level `packageManager`. Neither is
          # declared here, so nothing is cached TODAY -- the exposure is
          # latent, and adding a `packageManager` field (an ordinary edit
          # that looks harmless) would switch it on silently, on the two
          # workflows where it matters most. Pinning it false keeps that
          # decision out of package.json. Nothing is lost: `npm ci` in the
          # next step installs from the committed lockfile either way.
          package-manager-cache: false

      - name: Install build tools
        run: pip install build twine

      - name: Build v2 React bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('dashboard.py').read()).group(1))")
          echo "Tag: $TAG | dashboard.py version: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "❌ Version mismatch! Tag=$TAG but dashboard.py=$VERSION"
            exit 1
          fi
          echo "✅ Versions match: $VERSION"

      - name: Build package
        run: python3 -m build

      - name: Assert v2 bundle is included in wheel
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert wheels, "No wheel built in dist/"

          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())

          required = [
              "clawmetry/static/v2/dist/index.html",
          ]
          missing = [path for path in required if path not in names]
          assert not missing, f"Missing from wheel: {missing}"

          assert any(
              name.startswith("clawmetry/static/v2/dist/assets/")
              for name in names
          ), "Missing v2 asset files from wheel"

          print("v2 bundle is present in wheel")
          PY

      # Build provenance: a signed, publicly verifiable statement binding these
      # exact artifacts to this workflow run, commit and repo. Free, and
      # independent of PyPI — `gh attestation verify dist/clawmetry-*.whl
      # --repo vivekchand/clawmetry` works for anyone, including an auditor who
      # has no reason to take our word for what produced a wheel.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: "dist/*"

      # ── Publishing: two mutually exclusive paths ───────────────────────────
      #
      # Trusted Publishing (OIDC) is the target state. It removes the
      # long-lived PYPI_API_TOKEN secret entirely — a standing credential that
      # can publish to PyPI is precisely what a supply-chain reviewer asks
      # about — and it is the only way to get PEP 740 attestations, which put
      # a verifiable "Provenance" badge on every release file linking back to
      # the workflow run that built it.
      #
      # Gated on a repo variable rather than switched outright, because it
      # CANNOT work until the Trusted Publisher is configured on PyPI, and
      # this repo auto-publishes on merge. Flipping it without the PyPI-side
      # setup would break releases.
      #
      # To switch (one time, ~2 minutes):
      #   1. https://pypi.org/manage/project/clawmetry/settings/publishing/
      #      Add a GitHub publisher: owner=vivekchand, repo=clawmetry,
      #      workflow=publish.yml, environment=(blank)
      #   2. Set repo variable PYPI_TRUSTED_PUBLISHING=true
      #      (Settings > Secrets and variables > Actions > Variables)
      #   3. Confirm the next release shows a Provenance badge on PyPI, then
      #      delete the PYPI_API_TOKEN secret and this fallback step.
      - name: Publish to PyPI (Trusted Publishing, attested)
        if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

      - name: Publish to PyPI (API token — legacy fallback)
        if: vars.PYPI_TRUSTED_PUBLISHING != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

name: C6 daily health check (branch-protection audit -- all 3 repos)

# Audits whether required E2E status checks are configured on main for
# ALL 3 repos: clawmetry, clawmetry-cloud, clawmetry-landing.
#
# clawmetry/main protection is read with github.token (same-repo,
# authenticated). For clawmetry-cloud and clawmetry-landing: these are
# private repos -- GITHUB_TOKEN cannot read them cross-repo (returns 403)
# and unauthenticated reads return 404. Both are reported as "unknown"
# (can't verify) rather than "error" (broken). The health check gate
# decision is based only on the clawmetry/main result (same-repo readable).
#
# On failure: posts an @-mentioned reminder to tracking issue #3964
# at most once per calendar day. On success: posts a GREEN confirmation.
#
# To close C6 (any of these paths -- all take under 2 minutes):
#   1. Actions > "Apply required E2E status checks (C6 -- one-shot)" >
#      confirm=APPLY, pat_token=<fine-grained PAT with Administration
#      read+write on clawmetry, clawmetry-cloud, clawmetry-landing>
#   2. Or: bash scripts/close-c6.sh
#   3. Or: Settings > Branches > main > Required status checks (each repo)
#
# Tracking: vivekchand/clawmetry#3964

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  c6-health:
    name: C6 required-status-checks audit
    runs-on: ubuntu-latest
    steps:
      - name: Audit branch protection and notify tracking issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          TOKEN = os.environ["GITHUB_TOKEN"]
          OWNER = "vivekchand"
          TRACKING_ISSUE = 3964
          MARKER = "<!-- c6-health-check -->"
          # Repo this workflow runs in. GITHUB_TOKEN is repo-scoped: it can
          # read clawmetry (same-repo) but returns 403 for other repos.
          # Private repos also return 404 for unauthenticated reads.
          # We only send the token to _WORKFLOW_REPO; others are tried
          # unauthenticated and reported as "unknown" when unreachable.
          _WORKFLOW_REPO = os.environ.get("GITHUB_REPOSITORY", "").split("/")[-1]

          HEADERS = {
              "Authorization": f"token {TOKEN}",
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": "clawmetry-c6-health/1.0",
          }

          # All 3 repos and their required checks.
          # Keep in sync with REQUIRED_CHECKS in scripts/apply_required_status_checks.py.
          # "E2E Gate (required)" is the aggregator job from e2e-gate.yml (PR #4111,
          # merged 2026-07-27); it polls the 4 underlying OSS E2E workflows.
          ALL_CHECKS = {
              "clawmetry": [
                  "E2E Gate (required)",
              ],
              "clawmetry-cloud": [
                  "Cloud golden-path browser E2E",
              ],
              "clawmetry-landing": [
                  "Landing golden path (C3)",
              ],
          }

          SETTINGS_URL = {
              repo: f"https://github.com/{OWNER}/{repo}/settings/branches"
              for repo in ALL_CHECKS
          }

          def api_get(path, auth=True):
              hdrs = HEADERS if auth else {k: v for k, v in HEADERS.items() if k != "Authorization"}
              req = urllib.request.Request(
                  f"https://api.github.com{path}", headers=hdrs
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read()), None
              except urllib.error.HTTPError as exc:
                  return None, exc.code

          def post_comment(body):
              url = (
                  f"https://api.github.com/repos/{OWNER}/clawmetry"
                  f"/issues/{TRACKING_ISSUE}/comments"
              )
              data = json.dumps({"body": body}).encode()
              hdrs = {**HEADERS, "Content-Type": "application/json"}
              req = urllib.request.Request(
                  url, data=data, headers=hdrs, method="POST"
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def read_protection(repo):
              """Read required status check contexts for repo/main.

              Returns (contexts: set[str], status: str) where status is:
                'ok'          -- read succeeded, contexts is the full set
                                 (may be empty if required checks are not yet
                                 configured -- outer loop detects "missing")
                'unknown'     -- cannot verify: 4xx from API (private or
                                 inaccessible repo) or branch is protected
                                 but details not readable (protection=None)
                'unprotected' -- branch has no protection configured
                'error'       -- unexpected failure (5xx or network error)

              Reads from both 'contexts' (legacy) and 'checks' (current) arrays
              so checks configured via the GitHub Settings UI are correctly seen.
              """
              data, err = api_get(
                  f"/repos/{OWNER}/{repo}/branches/main",
                  auth=(repo == _WORKFLOW_REPO),
              )
              if err is not None or data is None:
                  if isinstance(err, int) and 400 <= err < 500:
                      return set(), "unknown"
                  return set(), "error"
              if not data.get("protected"):
                  return set(), "unprotected"
              prot = data.get("protection")
              if prot is None:
                  return set(), "unknown"
              rsc = (prot.get("required_status_checks") or {})
              contexts = set(rsc.get("contexts") or [])
              for item in (rsc.get("checks") or []):
                  if isinstance(item, dict) and item.get("context"):
                      contexts.add(item["context"])
              return contexts, "ok"

          # Audit all repos.
          results = {}
          for repo, required in ALL_CHECKS.items():
              actual, pstatus = read_protection(repo)
              if pstatus == "ok":
                  missing = [c for c in required if c not in actual]
                  results[repo] = {
                      "status": "missing" if missing else "ok",
                      "missing": missing,
                  }
              else:
                  results[repo] = {"status": pstatus, "missing": []}

          today_utc = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          # Fetch recent comments (50 covers 7 days of health checks + cron fires).
          comments, _ = api_get(
              f"/repos/{OWNER}/clawmetry/issues/{TRACKING_ISSUE}"
              "/comments?per_page=50&sort=updated&direction=desc"
          )

          # Dedup: skip if THIS health check already posted today.
          for c in comments or []:
              author = (c.get("user") or {}).get("login", "")
              posted = (c.get("created_at") or "")[:10]
              body_text = c.get("body", "")
              if (
                  author == "github-actions[bot]"
                  and posted == today_utc
                  and MARKER in body_text
              ):
                  print(f"Health check already posted today ({today_utc}). Skipping.")
                  sys.exit(1 if results.get("clawmetry", {}).get("status") != "ok" else 0)

          # Count previous health-check posts for escalation display.
          prev_check_count = sum(
              1
              for c in (comments or [])
              if (c.get("user") or {}).get("login", "") == "github-actions[bot]"
              and MARKER in c.get("body", "")
          )

          # Count consecutive green days (for stop-condition detection).
          # Walk prior health-check comments newest-first; stop at the first
          # non-green day so only an unbroken streak counts.
          def count_green_streak(comments_list, today):
              """Return number of consecutive calendar days health-check was GREEN,
              NOT counting today (caller adds 1 when today is green)."""
              prior = sorted(
                  (c for c in (comments_list or [])
                   if (c.get("user") or {}).get("login", "") == "github-actions[bot]"
                   and MARKER in c.get("body", "")
                   and (c.get("created_at") or "")[:10] != today),
                  key=lambda c: c.get("created_at", ""),
                  reverse=True,
              )
              streak = 0
              for c in prior:
                  if "confirmed GREEN" in c.get("body", ""):
                      streak += 1
                  else:
                      break
              return streak

          # Determine overall state.
          has_confirmed_missing = any(
              r["status"] in ("missing", "unprotected") for r in results.values()
          )
          clawmetry_status = results.get("clawmetry", {}).get("status")
          all_confirmed_ok = clawmetry_status == "ok" and not has_confirmed_missing

          # Build per-repo status table rows.
          rows = []
          for repo, result in results.items():
              if result["status"] == "ok":
                  rows.append(f"| **{repo}/main** | OK | all required checks configured |")
              elif result["status"] == "missing":
                  missing_str = ", ".join(f"`{c}`" for c in result["missing"])
                  rows.append(f"| **{repo}/main** | MISSING | {missing_str} |")
              elif result["status"] == "unprotected":
                  rows.append(
                      f"| **{repo}/main** | UNPROTECTED | no branch protection configured -- "
                      f"[Settings > Branches]({SETTINGS_URL[repo]}) |"
                  )
              elif result["status"] == "unknown":
                  rows.append(
                      f"| **{repo}/main** | UNKNOWN | cannot verify cross-repo "
                      f"(private repo or GITHUB_TOKEN scope limit) -- "
                      f"[verify manually]({SETTINGS_URL[repo]}) |"
                  )
              else:
                  rows.append(f"| **{repo}/main** | ERROR | API error -- verify manually |")
          table = (
              "| Repo | Status | Detail |\n"
              "|------|--------|--------|")
          table += "\n" + "\n".join(rows)

          if all_confirmed_ok:
              prior_green = count_green_streak(comments, today_utc)
              green_streak = prior_green + 1  # today counts
              stop_condition_met = green_streak >= 7
              stop_date = (datetime.now(timezone.utc) + timedelta(days=7 - green_streak)).strftime("%Y-%m-%d")

              if stop_condition_met:
                  body = (
                      f"{MARKER}\n"
                      f"**C6 health check {today_utc}: STOP CONDITION MET -- "
                      f"all 7 criteria green for {green_streak} consecutive days.**\n\n"
                      f"{table}\n\n"
                      "All 7 E2E robustness criteria have been green for 7+ consecutive days. "
                      "The mandate is fulfilled.\n\n"
                      "**Action required:** disable the E2E robustness cron at "
                      "https://claude.ai/code/scheduled"
                  )
                  # Tick the C6 checkbox in the issue body if still unchecked.
                  issue_data, _ = api_get(
                      f"/repos/{OWNER}/clawmetry/issues/{TRACKING_ISSUE}"
                  )
                  if issue_data and "- [ ] **C6" in (issue_data.get("body") or ""):
                      new_body = (issue_data["body"] or "").replace(
                          "- [ ] **C6", "- [x] **C6", 1
                      )
                      patch_data = json.dumps({"body": new_body}).encode()
                      patch_req = urllib.request.Request(
                          f"https://api.github.com/repos/{OWNER}/clawmetry"
                          f"/issues/{TRACKING_ISSUE}",
                          data=patch_data,
                          headers={**HEADERS, "Content-Type": "application/json"},
                          method="PATCH",
                      )
                      try:
                          with urllib.request.urlopen(patch_req) as r:
                              print("Checked C6 box in issue body.")
                      except Exception as exc:
                          print(f"Warning: could not update issue body: {exc}")
              else:
                  body = (
                      f"{MARKER}\n"
                      f"**C6 health check {today_utc}: clawmetry/main confirmed GREEN -- "
                      f"day {green_streak}/7 of stop-condition countdown.**\n\n"
                      f"{table}\n\n"
                      "clawmetry/main: `E2E Gate (required)` confirmed present. "
                      "clawmetry-cloud and clawmetry-landing: cannot verify cross-repo "
                      "(private repos -- GITHUB_TOKEN scope limit; "
                      "verify manually at Settings > Branches).\n\n"
                      f"Day {green_streak}/7: all 7 criteria must hold green for "
                      "7 consecutive days for the stop-condition to trigger. "
                      f"Stop-condition countdown ends {stop_date} if no regression. "
                      "Disable the cron at https://claude.ai/code/scheduled once done."
                  )
          else:
              total_missing = sum(len(r["missing"]) for r in results.values())
              unknown_repos = [r for r, v in results.items() if v["status"] == "unknown"]
              unknown_note = (
                  f" ({len(unknown_repos)} private repo(s) not readable cross-repo -- verify manually)"
                  if unknown_repos else ""
              )
              if total_missing:
                  summary = f"{total_missing} required check(s) not yet configured{unknown_note}"
              else:
                  summary = f"status unknown for {len(unknown_repos)} repo(s) -- manual verify required"

              body = (
                  f"{MARKER}\n"
                  f"@{OWNER} **C6 health check {today_utc} (day {prev_check_count + 1}): {summary}.**\n\n"
                  f"{table}\n\n"
                  "**Fastest close -- no PAT, no tools, ~60 s in any browser:**\n\n"
                  "Add the check name in GitHub Settings UI (GitHub autocompletes from recent CI runs):\n\n"
                  "1. [clawmetry Settings > Branches](https://github.com/vivekchand/clawmetry/settings/branches)"
                  " -- edit main, enable \"Require status checks\", add:\n"
                  "   - `E2E Gate (required)`\n"
                  "2. [clawmetry-cloud Settings > Branches](https://github.com/vivekchand/clawmetry-cloud/settings/branches)"
                  " -- add `Cloud golden-path browser E2E`\n"
                  "3. [clawmetry-landing Settings > Branches](https://github.com/vivekchand/clawmetry-landing/settings/branches)"
                  " -- add `Landing golden path (C3)`\n\n"
                  "<details><summary>Alternative: one-shot via Actions (needs fine-grained PAT with Administration: write)</summary>\n\n"
                  "[Create PAT](https://github.com/settings/personal-access-tokens/new?name=clawmetry-c6)"
                  " (repos: clawmetry/clawmetry-cloud/clawmetry-landing, permission: Administration read+write)"
                  " then [Run workflow](https://github.com/vivekchand/clawmetry/actions/workflows/apply-required-checks.yml)"
                  " with `confirm=APPLY`, `pat_token=<PAT>`. Or: `bash scripts/close-c6.sh`.\n\n"
                  "</details>\n\n"
                  "C1/C2/C3/C4/C5/C7 are green. C6 is the sole remaining blocker."
              )

          result_obj = post_comment(body)
          print(f"Posted: {result_obj['html_url']}")
          sys.exit(1 if has_confirmed_missing else 0)
          PYEOF

name: i18n docs autotranslate

# Regenerates docs/i18n/<lang>/README.md from README.md via the Claude Code CLI
# (no API key; set CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`). English
# README.md is the source of truth; idempotent via a source-hash marker, so only
# READMEs whose English source changed are re-translated. Skips if no token.

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated locale codes (blank = all enabled)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  translate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reasoning as i18n-autotranslate.yml: this working copy is
          # never pushed from. The only networked git operation is the
          # `Open sync PR` step, and peter-evans/create-pull-request supplies
          # its own credential from its `token` input rather than reading a
          # persisted one. scripts/i18n_translate_docs.py does not touch git
          # at all. So this credential has no consumer, and would otherwise
          # stay readable in .git/config across the Claude Code CLI run.
          persist-credentials: false

      - name: Guard - require Claude Code token
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN not set - skipping docs autotranslate. Generate one with 'claude setup-token' and add it as a repo secret, or run scripts/i18n_translate_docs.py locally where Claude Code is signed in."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.SKIP != '1'
        with:
          python-version: '3.11'

      # The pinned CLI declares `engines: node >=22`, and this job previously
      # relied on whatever Node the runner image happened to ship. Pinning the
      # toolchain here keeps `npm ci` reproducible rather than image-dependent.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SKIP != '1'
        with:
          node-version: "22"

      # Installed from a committed lockfile rather than the registry's moving
      # `latest`. This job holds `contents: write`, `pull-requests: write` and
      # the CLAUDE_CODE_OAUTH_TOKEN secret, so what this step installs runs with
      # both — and `npm install -g @anthropic-ai/claude-code` took whatever the
      # tag pointed at the moment the job ran, which is the window a compromised
      # release is published into.
      #
      # `npm ci` installs exactly the tree recorded in
      # .github/claude-cli/package-lock.json and verifies every tarball against
      # the integrity hash stored beside it. A bare `@version` pin does neither:
      # it re-resolves transitive deps on each run and checks nothing. The npm
      # entry in .github/dependabot.yml is what keeps the lock from going stale.
      - name: Install Claude Code CLI (from lockfile)
        if: env.SKIP != '1'
        working-directory: .github/claude-cli
        run: |
          npm ci --no-audit --no-fund --silent
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Translate README into all locales
        if: env.SKIP != '1'
        # The dispatch input is untrusted text. Bind it to an env var and read
        # it as a quoted shell variable — YAML quotes do NOT protect here,
        # because ${{ }} is substituted textually before bash parses the line.
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python3 scripts/i18n_translate_docs.py \
            --readme README.md \
            --locales-dir clawmetry/static/locales \
            --out-dir docs/i18n \
            --only "$ONLY"

      - name: Open sync PR
        if: env.SKIP != '1'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/i18n-docs-autotranslate
          delete-branch: true
          commit-message: 'docs(i18n): sync translated READMEs'
          title: 'docs(i18n): sync translated READMEs'
          labels: i18n
          body: |
            Automated translation of `README.md` into `docs/i18n/<lang>/README.md`.
            Generated by `scripts/i18n_translate_docs.py` (Claude Code CLI). English
            `README.md` is the source of truth. Review and merge.
